<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sin conexión | La Pichincha</title>
<!-- El service worker devuelve esta pagina en la URL de OTRA pagina cuando no hay conexion ni copia:
     por eso no usa rutas relativas ni archivos externos (estilos adentro). -->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         font: 16px/1.5 system-ui, sans-serif; background: #f4f6f9; color: #14181f; }
  main { max-width: 34rem; }
  h1 { font-size: 1.6rem; margin: 0 0 10px; letter-spacing: -.02em; }
  p { color: #4e5767; margin: 0 0 18px; }
  a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #0b4fd8; color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e1117; color: #e9edf4; }
    p { color: #aab3c2; }
    a { background: #6c9bff; color: #0e1117; }
  }
</style>
</head>
<body>
<main>
  <h1>Esta página no está disponible sin conexión</h1>
  <p>Todavía no la abriste con internet, así que no la tenemos guardada. Cuando vuelva la conexión se carga sola. Mientras tanto, podés volver a La Pichincha: ahí quedan guardados los últimos precios que bajaste.</p>
  <a id="volver" href="./">Volver a La Pichincha</a>
</main>
<script>
  // "./" apunta a esta misma URL si se sirve dentro de /precios/...: el alcance del service worker es la raiz del sitio.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(function (r) {
    if (r && r.scope) document.getElementById("volver").href = r.scope;
  });
</script>
</body>
</html>
