<style>
/* Layout: barra de pestanas fija, grilla de tarjetas verticales por vista, y
   una vista de analisis que entra por encima al tocar una tarjeta. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eceff4;
  --ink:#14181f; --ink-2:#4e5767; --ink-3:#78839a; --line:#d9dfe8;
  --accent:#0b4fd8; --accent-soft:#e3ecff;
  --good:#117a4a; --good-soft:#dff3e8; --bad:#a52020;
  --cg:#6534e8; --cg-soft:#efe9ff;
  --gc:#0b7f80; --gc-soft:#d8f2f2;
  --mx:#a85a07; --mx-soft:#fbeeda;
  --fh:#4e5767; --fh-soft:#e7eaf0;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,24,31,.05), 0 8px 24px -12px rgba(20,24,31,.18);
  --shadow-up:0 2px 4px rgba(20,24,31,.06), 0 20px 44px -16px rgba(20,24,31,.3);
  --curva:cubic-bezier(.2,.75,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b23; --surface-2:#1e242e; --ink:#e9edf4; --ink-2:#aab3c2;
    --ink-3:#7c8799; --line:#2b323d; --accent:#6c9bff; --accent-soft:#1a2740;
    --good:#4ec98b; --good-soft:#12301f; --bad:#ef8080;
    --cg:#a78bfa; --cg-soft:#241c3d; --gc:#5eead4; --gc-soft:#0f2d2c;
    --mx:#fbbf24; --mx-soft:#2e2311; --fh:#aab3c2; --fh-soft:#232a35;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-up:0 2px 4px rgba(0,0,0,.5), 0 20px 44px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b23; --surface-2:#1e242e; --ink:#e9edf4; --ink-2:#aab3c2;
  --ink-3:#7c8799; --line:#2b323d; --accent:#6c9bff; --accent-soft:#1a2740;
  --good:#4ec98b; --good-soft:#12301f; --bad:#ef8080;
  --cg:#a78bfa; --cg-soft:#241c3d; --gc:#5eead4; --gc-soft:#0f2d2c;
  --mx:#fbbf24; --mx-soft:#2e2311; --fh:#aab3c2; --fh-soft:#232a35;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-up:0 2px 4px rgba(0,0,0,.5), 0 20px 44px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
.c-cg{--c:var(--cg);--c-soft:var(--cg-soft)}
.c-gc{--c:var(--gc);--c-soft:var(--gc-soft)}
.c-mx{--c:var(--mx);--c-soft:var(--mx-soft)}
.c-fh{--c:var(--fh);--c-soft:var(--fh-soft)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:26px 64px}
h1{font-size:clamp(1.55rem,4vw,2.1rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:1.2rem;margin:0 0 4px;letter-spacing:-.02em;text-wrap:balance}
h3{margin:0;font-size:1.02rem;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--ink-2);margin:0;max-width:66ch;font-size:.94rem}
.meta{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.11em;margin:0 0 10px}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes entraPanel{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes entraDetalle{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}

/* ---- Pestanas ---- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:4px;position:relative;overflow-x:auto;scrollbar-width:none;
  background:var(--surface-2);border-radius:12px;padding:4px}
.tablist::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:1 1 auto;text-align:center;white-space:nowrap;
  padding:9px 16px;border-radius:9px;font-size:.9rem;font-weight:500;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:color .22s var(--curva),background .22s var(--curva)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tab .n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);
  background:var(--bg);border-radius:5px;padding:0 5px}
.tab[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}

.panel{animation:entraPanel .32s var(--curva) both}
.panel-head{margin-bottom:18px}

/* ---- Grilla de tarjetas verticales ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:18px;align-items:start}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:0 0 20px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;
  animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*80ms);
  transition:transform .28s var(--curva),box-shadow .28s,border-color .28s}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:var(--shadow-up);border-color:var(--c)}
.card.dest{border-color:var(--good)}
.card .barra{height:5px;background:var(--c);flex:none}
.card.dest .barra{background:var(--good)}
.cinta{position:absolute;top:5px;right:0;background:var(--good);color:#fff;
  font:600 .65rem/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
  padding:7px 12px;border-bottom-left-radius:11px;display:flex;align-items:center;gap:5px;z-index:2}
:root[data-theme="dark"] .cinta{color:#0e1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cinta{color:#0e1117}}
.card .foto{height:150px;background:#fff;padding:14px;flex:none;overflow:hidden;
  border-bottom:1px solid var(--line)}
.card .foto img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .35s var(--curva)}
.card:hover .foto img{transform:scale(1.07)}
.card .cuerpo{padding:16px 20px 0;display:flex;flex-direction:column;gap:9px;flex:1}
.rank{position:absolute;top:19px;left:14px;font-family:var(--font-mono);font-size:.92rem;font-weight:700;
  color:var(--c);background:var(--c-soft);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;z-index:2}
.card.dest .rank{color:var(--good);background:var(--good-soft)}
.tienda{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c);
  background:var(--c-soft);border-radius:999px;padding:3px 11px;font-size:.78rem;width:max-content}
.titular{color:var(--ink-2);font-size:.89rem;margin:0}
.precio{font-family:var(--font-mono);font-size:1.62rem;font-weight:700;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--c);line-height:1.1}
.card.dest .precio{color:var(--good)}
.antes{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-3);text-decoration:line-through;margin-left:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 .71rem/1.7 var(--font-mono);padding:1px 8px;border-radius:6px;
  background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.pie{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ver{font-size:.84rem;font-weight:600;color:var(--c);display:inline-flex;align-items:center;gap:5px;
  transition:gap .2s var(--curva)}
.card:hover .ver{gap:9px}
.ir{font-size:.78rem;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.ir:hover{color:var(--accent)}

/* ---- Vista de analisis ---- */
.detalle{animation:entraDetalle .36s var(--curva) both}
.volver{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:.88rem;
  font-weight:600;color:var(--accent);margin-bottom:16px;padding:7px 13px;border-radius:9px;
  background:var(--accent-soft);transition:gap .2s var(--curva)}
.volver:hover{gap:11px}
.dcab{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  background:var(--surface);border:1px solid var(--c);border-radius:16px;padding:20px 24px;
  box-shadow:var(--shadow);margin-bottom:18px}
.dfoto{width:92px;height:92px;background:#fff;border-radius:12px;border:1px solid var(--line);
  padding:8px;flex:none;overflow:hidden}
.dfoto img{width:100%;height:100%;object-fit:contain;display:block}
.dsku{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-3);margin:4px 0 8px}
.dprecio{text-align:right;white-space:nowrap}
.dprecio .v{font-family:var(--font-mono);font-size:1.75rem;font-weight:700;letter-spacing:-.035em;
  color:var(--c);display:block;font-variant-numeric:tabular-nums}
.dprecio .l{font-size:.76rem;color:var(--ink-3);display:block;margin-top:3px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-bottom:18px}
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  box-shadow:var(--shadow);min-width:0}
.bloque h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.lista li{color:var(--ink-2);padding-left:23px;position:relative}
.lista li::before{position:absolute;left:0;top:0;font-family:var(--font-mono);font-weight:700}
.lista li.p::before{content:"\2191";color:var(--good)}
.lista li.m::before{content:"\2193";color:var(--bad)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--surface-2);font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
thead th.foco{color:var(--c)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody th{font-weight:500;color:var(--ink-2);font-size:.84rem;white-space:nowrap}
td{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.84rem;color:var(--ink-2)}
td.foco{color:var(--ink);font-weight:700;background:var(--c-soft)}
td.mejor{color:var(--good);font-weight:700}

/* ---- Tiendas ---- */
.wins{margin:12px 0 0;padding:0;list-style:none}
.wins li{border-top:1px dashed var(--line)}
.wins li:first-child{border-top:0}
.wins a{display:flex;align-items:center;gap:12px;padding:9px 10px;margin-inline:-10px;border-radius:10px;
  text-decoration:none;color:inherit;font-size:.88rem;transition:background .18s,padding-left .18s}
.wins a:hover{background:var(--c-soft);padding-left:16px}
.wins .mini{width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid var(--line);
  padding:3px;flex:none;overflow:hidden}
.wins .mini img{width:100%;height:100%;object-fit:contain;display:block}
.wins .txt{flex:1;color:var(--ink-2);min-width:0}
.wins b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--good);font-weight:700}
.flaco{margin:14px 0 0;font-size:.87rem;color:var(--ink-2);padding:11px 13px;background:var(--surface-2);
  border-radius:10px;display:flex;gap:9px;align-items:flex-start}
.flaco .ico{color:var(--bad);margin-top:3px}

/* ---- Veredicto ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow);animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*70ms)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile .k{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;letter-spacing:-.03em;margin:3px 0 1px;
  font-variant-numeric:tabular-nums}
.tile.ok .v{color:var(--good)}
.tile .d{font-size:.82rem;color:var(--ink-2)}
.ver-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:12px;box-shadow:var(--shadow);
  animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*70ms)}
.ver-item b{display:block;margin-bottom:5px}
.ver-item p{margin:0;color:var(--ink-2);font-size:.92rem}
.nota{margin-top:30px;font-size:.81rem;color:var(--ink-3);max-width:74ch}
.nota code{font-family:var(--font-mono);font-size:.95em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){
  .dcab{grid-template-columns:auto 1fr;gap:14px;padding:18px}
  .dprecio{grid-column:1/-1;text-align:left;border-top:1px solid var(--line);padding-top:14px}
  .tab{padding:9px 12px;font-size:.85rem}
  .wrap{padding-block:18px 52px}
}
</style>

const $ = (s, r = document) => r.querySelector(s);
const pesos = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("es-AR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const icono = n => `<svg class="ico"><use href="#i-${n}"/></svg>`;

const P = DATOS.productos || [];
const T = DATOS.tiendas || {};
const porId = Object.fromEntries(P.map(p => [p.id, p]));
const de = tipo => P.filter(p => p.tipo === tipo).sort((a, b) => a.podio - b.podio);
const rams = de("ram"), cams = de("webcam");

const VISTAS = [
  { id: "memorias", eti: "Memorias", ico: "chip", n: () => rams.length },
  { id: "tiendas", eti: "Tiendas", ico: "store", n: () => 3 },
  { id: "webcams", eti: "Webcams", ico: "cam", n: () => cams.length },
  { id: "veredicto", eti: "Veredicto", ico: "trofeo", n: () => null }
];

/* --- Tarjeta --- */
function tarjeta(p, i) {
  const t = T[p.tienda] || {};
  return `<button class="card c-${t.color || "fh"}${p.destacado ? " dest" : ""}" style="--i:${i}"
      data-abrir="${p.id}" aria-label="Ver análisis de ${esc(p.nombre)}">
    <div class="barra"></div>
    ${p.destacado ? `<span class="cinta">${icono("trofeo")} mejor</span>` : ""}
    <span class="rank">${p.podio}</span>
    <div class="foto"><img src="${p.img}" alt="${esc(p.nombre)}" loading="lazy"></div>
    <div class="cuerpo">
      <h3>${esc(p.nombre)}</h3>
      <span class="tienda">${icono("store")} ${esc(t.nombre || "")}</span>
      <div><span class="precio">${pesos(p.precio)}</span>${p.precio_lista ? `<span class="antes">${pesos(p.precio_lista)}</span>` : ""}</div>
      <p class="titular">${esc(p.titular || "")}</p>
      <div class="chips">${(p.chips || []).map(c => `<span class="chip${/ns|retiro|stock|OFF/.test(c) ? " ok" : ""}">${esc(c)}</span>`).join("")}</div>
      <div class="pie">
        <span class="ver">Ver análisis ${icono("der")}</span>
        <span class="ir">${icono("fuera")} ${esc(t.nombre || "")}</span>
      </div>
    </div>
  </button>`;
}

/* --- Tabla comparativa, resaltando el producto abierto --- */
function comparativa(grupo, foco) {
  const filas = Object.keys(grupo[0].specs || {});
  const color = T[foco.tienda].color;
  const mejor = {
    "Latencia real": v => v === "10,0 ns", "Disipador": v => v.startsWith("sí"),
    "Garantía local": v => parseInt(v) >= 36, "Retiro en Mendoza": v => v.startsWith("sí"),
    "Voltaje del perfil": v => v.includes("1,2"), "Rangos": v => v.startsWith("doble")
  };
  return `<div class="scroll"><table>
    <thead><tr><th>&nbsp;</th>${grupo.map(p =>
      `<th class="${p.id === foco.id ? "foco" : ""}">${esc(p.corto)}</th>`).join("")}</tr></thead>
    <tbody>
      <tr><th>Precio</th>${grupo.map(p => celda(pesos(p.precio), p, foco, p.precio === Math.min(...grupo.map(x => x.precio)))).join("")}</tr>
      ${filas.map(f => `<tr><th>${esc(f)}</th>${grupo.map(p =>
        celda(p.specs[f], p, foco, mejor[f] ? mejor[f](p.specs[f]) : false)).join("")}</tr>`).join("")}
    </tbody></table></div>`.replace(/class="scroll"/, `class="scroll c-${color}"`);
}
const celda = (v, p, foco, destacar) =>
  `<td class="${p.id === foco.id ? "foco" : ""}${destacar ? " mejor" : ""}">${esc(v)}</td>`;

/* --- Vista de analisis --- */
function detalle(p) {
  const t = T[p.tienda], grupo = p.tipo === "ram" ? rams : cams;
  return `<div class="detalle c-${t.color}">
    <button class="volver" data-volver>${icono("izq")} Volver a ${p.tipo === "ram" ? "memorias" : "webcams"}</button>
    <div class="dcab">
      <div class="dfoto"><img src="${p.img}" alt="${esc(p.nombre)}"></div>
      <div>
        <h2>${esc(p.nombre)}</h2>
        <p class="dsku">${esc(p.sku || "")}</p>
        <span class="tienda">${icono("store")} ${esc(t.nombre)} · ${esc(t.entrega)}</span>
      </div>
      <div class="dprecio">
        <a class="v" href="${p.url}" target="_blank" rel="noopener">${pesos(p.precio)}</a>
        <span class="l">${p.precio_lista ? "lista " + pesos(p.precio_lista) + " · " : ""}${esc(t.promo)}</span>
        <span class="l"><a class="ir" href="${p.url}" target="_blank" rel="noopener">${icono("fuera")} abrir en ${esc(t.nombre)}</a></span>
      </div>
    </div>
    <div class="dos">
      <div class="bloque"><h3>${icono("check")} A favor</h3>
        <ul class="lista">${(p.pros || []).map(x => `<li class="p">${esc(x)}</li>`).join("")}</ul></div>
      <div class="bloque"><h3>${icono("aviso")} En contra</h3>
        <ul class="lista">${(p.contras || []).map(x => `<li class="m">${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <div class="panel-head"><h2>${icono("balanza")} Lo que cambia entre las tres</h2>
      <p class="sub">La columna resaltada es la que estás mirando. En verde, el mejor valor de cada fila.</p></div>
    ${comparativa(grupo, p)}
  </div>`;
}

    <div class="tiles">${tiles.map((t, i) => `<div class="tile${t.ok ? " ok" : ""}" style="--i:${i}">
      <div class="k">${esc(t.k)}</div><div class="v">${t.v}</div><div class="d">${esc(t.d)}</div></div>`).join("")}</div>
    <div class="tiles"><div class="tile" style="--i:0"><div class="k">${icono("camion")} Combo RAM + webcam, todo en Gaming City</div>
      <div class="v">${pesos(c.combo_gc)}</div><div class="d">una sola compra, retiro gratis</div></div>
      <div class="tile ok" style="--i:1"><div class="k">${icono("camion")} Combo partido entre dos tiendas</div>
      <div class="v">${pesos(c.combo_partido)}</div><div class="d">${pesos(c.combo_gc - c.combo_partido)} menos, y la RAM mejora</div></div></div>
    ${(DATOS.veredicto || []).map((v, i) => `<div class="ver-item" style="--i:${i}">
      <b>${esc(v.t)}</b><p>${esc(v.d)}</p></div>`).join("")}</div>`;
}

/* --- Ruteo --- */
function pintar(id) {
  const v = $("#vista");
  if (id === "memorias") v.innerHTML = vistaGrilla(rams, "Las 3 mejores memorias por marca/precio",
    "Módulo único de 16GB DDR4 3200 para escritorio. El detalle de specs está dentro de cada tarjeta.");
  else if (id === "webcams") v.innerHTML = vistaGrilla(cams, "Las 3 mejores webcams",
    "Las que valen la pena de las trece relevadas en las mismas tiendas.");
  else if (id === "tiendas") v.innerHTML = vistaTiendas();
  else if (id === "veredicto") v.innerHTML = vistaVeredicto();
  else if (porId[id]) { v.innerHTML = detalle(porId[id]); return; }
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.ir === id)));
}

/* El hash es la unica fuente de verdad: asi andan el boton Atras del
   navegador, los enlaces directos a una tarjeta y recargar la pagina. */
let subirAlPintar = false;

function aplicar(id) {
  pintar(VISTAS.some(v => v.id === id) || porId[id] ? id : "memorias");
  if (subirAlPintar) $(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
  subirAlPintar = false;
}

function ir(id, scroll) {
  subirAlPintar = !!scroll;
  if (location.hash.slice(1) === id) aplicar(id);
  else location.hash = id;
}

window.addEventListener("hashchange", () => aplicar(location.hash.slice(1)));

function arrancar() {
  if (!P.length) { $("#vista").innerHTML = '<p class="sub">No hay datos cargados todavía. Corré <code>python actualizar.py --build</code>.</p>'; return; }
  $("#tablist").innerHTML = VISTAS.map(v => {
    const n = v.n();
    return `<button class="tab" role="tab" data-ir="${v.id}" aria-selected="false">
      ${icono(v.ico)} ${v.eti}${n ? ` <span class="n">${n}</span>` : ""}</button>`;
  }).join("");
  $("#sello").textContent = `Precios verificados en cada sitio · actualizado ${DATOS.actualizado} · ${P.length} productos seguidos`;
  $("#nota").innerHTML = `Precios con IVA tomados de CompraGamer, Gaming City, Mexx y FullH4rd, con el precio de
    transferencia o depósito de cada una. Las specs salen de las webs de ADATA, Corsair y Kingston, no de las fichas
    de las tiendas. Para refrescar todo: <code>python actualizar.py</code>. El stock y los precios de hardware se
    mueven rápido: confirmá antes de pagar.`;

  document.addEventListener("click", ev => {
    const tab = ev.target.closest(".tab");
    if (tab) return ir(tab.dataset.ir, false);
    const abrir = ev.target.closest("[data-abrir]");
    if (abrir) return ir(abrir.dataset.abrir, true);
    if (ev.target.closest("[data-volver]")) {
      const p = porId[location.hash.slice(1)];
      return ir(p && p.tipo === "webcam" ? "webcams" : "memorias", true);
    }
  });

  aplicar(location.hash.slice(1));
}
arrancar();
</script>
