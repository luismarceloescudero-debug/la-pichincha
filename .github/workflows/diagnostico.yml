# Prueba la verificacion de enlaces contra el caso real: el indice publicado y las publicaciones de verdad
# (Mercado Libre, Fravega, AliExpress...). Corre en cada PR que toque la verificacion y a mano. No publica nada.
name: Verificacion de enlaces (caso real)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - verificar_ofertas.py
      - diagnostico_enlaces.py
      - filtrar_indice.py
      - .github/workflows/diagnostico.yml

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bajar el indice publicado y elegir las candidatas reales
        run: |
          base=$(python -c 'import json;print(json.load(open("sitio.json"))["base_url"])')
          curl -fsSL "$base/indice.json" -o indice.json
          node generar_feed.js --indice indice.json --candidatas candidatas.json --max 40
      - name: Diagnosticar que ve el servidor en cada publicacion
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python diagnostico_enlaces.py candidatas.json --max 15 --salida diagnostico.json
      # La verificacion de verdad (la misma que decide que se publica) sobre las 40 candidatas reales y su precio.
      - name: Verificar las candidatas reales como en la publicacion
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          echo '[]' > diagnostico-descartadas.json
          python verificar_ofertas.py candidatas.json --descartadas diagnostico-descartadas.json | tee -a "$GITHUB_STEP_SUMMARY" || true
      # Las tiendas VTEX que llegan por ComparaYa, verificadas por su API publica desde los servidores de GitHub.
      - name: Probar la API de las tiendas VTEX del indice
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, urllib.parse, verificar_ofertas as v
          idx = json.load(open("indice.json", encoding="utf-8"))
          vistos = {}
          for f in idx["productos"]:
              h = urllib.parse.urlparse(f[2]).netloc
              if f[3] == "comparaya" and f[2].rstrip("/").endswith("/p") and "mercadolibre" not in h and len(vistos.setdefault(h, [])) < 3:
                  vistos[h].append(f)
          print("### Tiendas VTEX por su API (desde GitHub)
")
          for h, filas in sorted(vistos.items()):
              for f in filas:
                  print(f"- {h}: {v.revisar_vtex(f[2], f[1])} (publicado {f[1]})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-enlaces
          path: diagnostico*.json
          retention-days: 14
