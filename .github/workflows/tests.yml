name: Tests

# Corre en cada PR y, llamado desde actualizar.yml, antes de cada publicacion:
# si un test falla no se commitea ni se despliega nada.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # coverage es solo herramienta de la CI: el sitio sigue usando la biblioteca estandar (constitucion I).
      - name: Instalar coverage
        run: python -m pip install --quiet coverage==7.16.2

      # Umbrales en CONSTRAINTS.md: no se bajan para que un PR pase.
      - name: Tests de Python con cobertura
        run: |
          python -m coverage run --source=. --omit="tests/*" -m unittest discover -s tests -t . -v
          python -m coverage report --fail-under=85

      - name: Tests de JS con cobertura
        run: >
          node --test --experimental-test-coverage
          --test-coverage-lines=90 --test-coverage-branches=85 --test-coverage-functions=85
          "tests/js/*.test.js"

  # Pruebas de punta a punta con Playwright (spec 051): Chromium contra el sitio armado con el indice de prueba de
  # tests/fixtures/e2e y los terceros simulados. Playwright es solo de la CI: no se publica (constitucion I, excepcion).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache de los navegadores
        id: navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium con sus dependencias
        if: steps.navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Con la cache del navegador hay que instalar igual las librerias del sistema.
      - name: Instalar las dependencias del sistema
        if: steps.navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Armar el sitio con el indice de prueba
        run: bash tests/e2e/armar-sitio.sh

      - name: Correr las pruebas
        run: npx playwright test

      # El reporte HTML y, de las pruebas que fallan, capturas y trazas (test-results).
      - name: Guardar el reporte y las capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reporte
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Lighthouse movil sobre el sitio armado con el indice publicado (CONSTRAINTS.md): las cuatro
  # categorias cortan si la mediana de tres corridas baja de 90.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Armar el sitio con el indice publicado
        run: |
          mkdir -p _sitio
          cp index.html _sitio/
          cp -r img js css _sitio/
          base=$(python -c 'import json;print(json.load(open("sitio.json"))["base_url"])')
          curl -fsSL "$base/indice.json" -o _sitio/indice.json || echo "::warning::No se pudo bajar el indice publicado"
          python generar_paginas.py --indice _sitio/indice.json --salida _sitio
          python publicar_app.py --salida _sitio --indice _sitio/indice.json
          node generar_feed.js --indice _sitio/indice.json --salida _sitio
          node generar_info.js --indice _sitio/indice.json --salud no-hay.json --salida _sitio
          node generar_portada.js --salida _sitio

      - name: Medir con Lighthouse
        run: |
          python -m http.server 8080 --directory _sitio >/dev/null 2>&1 &
          sleep 2
          # Si Chrome no arranca en el runner se reintenta (solo ese error: un puntaje bajo corta igual).
          # Tres corridas por pagina: el verificador evalua la mediana (la primera sale con Chrome en frio).
          for ruta in "" precios/ hoy/ estado/ legal/ contacto/; do
            for i in 1 2 3; do
              nombre=$(echo "lh-${ruta:-portada}-$i" | tr -d /)
              bash .github/lighthouse-corrida.sh npx --yes lighthouse@12.8.2 "http://localhost:8080/$ruta" --quiet --output=json \
                --output-path="$nombre.json" --only-categories=performance,accessibility,best-practices,seo \
                --chrome-flags="--headless=new --no-sandbox"
            done
          done
          # Sin tubo: el codigo de salida del verificador es el que corta la corrida.
          node .github/lighthouse.js lh-*.json > lighthouse.txt || falla=1
          cat lighthouse.txt
          { echo '### Lighthouse movil'; echo '```'; cat lighthouse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${falla:-0}

      # Los informes completos, para diagnosticar una medicion del runner sin repetirla.
      - name: Guardar los informes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lh-*.json
          retention-days: 14
