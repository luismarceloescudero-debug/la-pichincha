name: Actualizar precios y publicar

# El indice de busqueda no vive en el repo: se arma aca y viaja directo al
# despliegue. En main se versiona datos.json; el historial de precios del
# indice vive en la rama huerfana `historial`, un CSV por mes.

on:
  # GitHub atrasa los cron, mas los de hora en punto: con "0 12" (09:00) las corridas del 15 al 24/10 arrancaron entre las
  # 11:56 y las 15:19. Dos horarios en minutos sueltos y temprano; el segundo es de respaldo y no corre si ya hay indice de
  # hoy publicado (trabajo "decidir").
  schedule:
    - cron: "17 8 * * *"        # 05:17 en Argentina
    - cron: "43 10 * * *"       # 07:43 en Argentina, respaldo
  workflow_dispatch:
    inputs:
      paginas:
        description: "Paginas por categoria al indexar"
        default: "12"
      indexar:
        description: "Rearmar el indice de busqueda"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Una corrida programada no rearma el indice si ya se publico uno de hoy (la primera ya salio, o se lanzo una a mano).
  decidir:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.hoy.outputs.correr }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: sitio.json
          sparse-checkout-cone-mode: false
      - id: hoy
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          correr=true
          if [ "$EVENTO" = "schedule" ]; then
            hoy=$(TZ=America/Argentina/Buenos_Aires date +%F)
            base=$(python3 -c 'import json;print(json.load(open("sitio.json"))["base_url"])')
            dia() { curl -fsSL "$base/$1" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("generado", ""))[:10])' || true; }
            # Hace falta el indice de hoy Y su mensaje: un push de madrugada que reindexa no manda Telegram (spec 030).
            if [ "$(dia guardia.json)" = "$hoy" ] && [ "$(dia telegram.json)" = "$hoy" ]; then
              correr=false; echo "Ya hay indice y mensaje del $hoy publicados: esta corrida programada no hace nada"
            fi
          fi
          echo "correr=$correr" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/tests.yml

  construir:
    needs: [tests, decidir]
    if: needs.decidir.outputs.correr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El historial vive en su propia rama y no en la cache de Actions, que
      # GitHub puede desalojar.
      - name: Traer el historial de precios
        uses: actions/checkout@v7
        with:
          ref: historial
          path: historial

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Relevar precios de los productos seguidos
        run: python actualizar.py

      # Se commitea solo si cambio algun precio: la hora de verificacion va
      # estampada en el sitio publicado, no en el repo.
      - name: Guardar los cambios de precio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet datos.json; then
            echo "sin cambios de precio"
          else
            git add datos.json index.html
            git commit -m "Actualizacion automatica de precios [skip ci]"
            git push
          fi

      # Si una tienda se cae o bloquea la IP del runner, el indice anterior
      # sigue sirviendo en lugar de publicar el sitio sin buscador.
      # La clave incluye el hash del indexador y de la configuracion de fuentes:
      # si cambia el formato del indice o se suma una tienda, no hay cache que
      # reusar y el paso siguiente rearma el indice solo.
      - name: Recuperar el indice anterior
        uses: actions/cache@v6
        with:
          path: indice.json
          key: indice-${{ hashFiles('indexar.py', 'mercadolibre.py', 'tiendas.json') }}-${{ github.run_id }}
          restore-keys: indice-${{ hashFiles('indexar.py', 'mercadolibre.py', 'tiendas.json') }}-

      # Relevar los 5 catalogos son ~17 minutos. En un push a main no hace falta:
      # alcanza con reusar el indice de la cache, salvo que no haya ninguno.
      - name: Armar el indice de busqueda
        id: indexar
        if: |
          (github.event_name == 'schedule') ||
          (github.event_name == 'workflow_dispatch' && inputs.indexar) ||
          (github.event_name == 'push' && hashFiles('indice.json') == '')
        # El valor del formulario va por el entorno y se valida: interpolado en el comando, "12; algo" correria en el job.
        # Mercado Libre (spec 026) se lee por su API oficial con el token de aplicacion; sin los secretos esa fuente falla
        # sola y queda la de la corrida anterior.
        env:
          PAGINAS: ${{ inputs.paginas || '12' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          case "$PAGINAS" in ''|*[!0-9]*) echo "::error::paginas tiene que ser un numero"; exit 1 ;; esac
          python indexar.py --max-paginas "$PAGINAS" --historial historial
        continue-on-error: true

      # Una corrida manual con menos paginas no escribe historia: veria como
      # bajas los productos que no llego a recorrer.
      - name: Guardar el historial de precios
        if: steps.indexar.outcome == 'success' && (inputs.paginas || '12') == '12'
        working-directory: historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios en el historial"
          else
            git commit -m "Precios del $(TZ=America/Argentina/Buenos_Aires date +%F)"
            git push
          fi

      - name: Avisar si una fuente se cayo
        if: github.event_name == 'schedule' && steps.indexar.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python salud.py salud.json

      # Primer chequeo (cada enlace deja su veredicto en telemetria.json, ver "Contar la fiabilidad por comercio"): las publicaciones se pueden caer entre que el agregador (ComparaYa) las leyo y ahora, y no
      # traen el stock. Se abren las 40 mejores candidatas (con Chrome, que ejecuta el JavaScript: el cartel de "no
      # esta disponible" de Mercado Libre lo arma el navegador) y las caidas se sacan del indice, asi no aparecen en
      # la pestaña Ofertas, el buscador, el feed ni Telegram. Hasta 3 rondas. Mercado Libre se verifica por su API (precio y vendedores): lo que no se pudo comprobar no sale. En las demas tiendas, ante la duda se deja. Si falla, el
      # indice sigue como estaba.
      - name: Verificar las publicaciones antes de armar el sitio
        continue-on-error: true
        timeout-minutes: 25
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          if [ -f indice.json ]; then
            command -v google-chrome >/dev/null || echo "::warning::No hay Chrome: solo se revisa el HTML de cada publicacion"
            echo '[]' > descartadas.json
            for ronda in 1 2 3; do
              node generar_feed.js --indice indice.json --descartadas descartadas.json --candidatas candidatas.json --max 40
              rc=0
              python verificar_ofertas.py candidatas.json --descartadas descartadas.json --telemetria telemetria.json || rc=$?
              [ "$rc" -eq 3 ] || break
            done
            python filtrar_indice.py indice.json descartadas.json
          fi

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp index.html _sitio/
          cp -r img js css _sitio/
          if [ -f indice.json ]; then
            cp indice.json _sitio/
            echo "indice: $(du -h indice.json | cut -f1)"
          else
            echo "::warning::Sin indice.json: el buscador va a quedar vacio en esta publicacion"
          fi

      # Lo mas buscado de la portada (spec 017, fase 3): conteos AGREGADOS de GoatCounter (personas distintas por busqueda, ultimos
      # 30 dias), con el minimo de personas y el filtro de datos personales de js/buscadas.js. Solo se escribe la lista de terminos.
      # El token es de solo lectura (GOATCOUNTER_TOKEN); sin el, o si algo falla, la portada sigue con las sugerencias fijas.
      - name: Armar lo mas buscado
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node generar_buscadas.js --salida _sitio || echo "::warning::No se armo lo mas buscado"

      # La portada sale con las pestañas, el sello y la Comparativa ya escritas, para que no espere al JS
      # (A3, CONSTRAINTS.md). Si falla, sale como antes y el JS la arma al abrir.
      - name: Pre-renderizar la portada
        run: node generar_portada.js --salida _sitio || echo "::warning::No se pre-renderizo la portada"

      # Si las paginas por busqueda fallan, el sitio y los precios se publican igual.
      - name: Generar las paginas por busqueda
        run: |
          if [ -f indice.json ]; then
            python generar_paginas.py --indice indice.json --salida _sitio || echo "::warning::No se generaron las paginas por busqueda"
          else
            python generar_paginas.py --indice indice.json --salida _sitio
          fi

      # Las series de precio por aviso (plan v2, D2): un fragmento chico por cada 1/64 de los avisos, que la pagina baja solo al
      # abrir el historial de uno. Salen del historial y del indice final (ya sin las ofertas caidas). Si falla, el sitio sale
      # igual y el boton dice que no pudo cargar.
      - name: Armar las series de precio
        run: |
          if [ -f indice.json ]; then
            python generar_series.py --indice indice.json --historial historial --salida _sitio || echo "::warning::No se armaron las series de precio"
          fi

      # La app instalable: estampa la version en sw.js (una cache nueva por publicacion, la anterior se
      # descarta) y copia el manifiesto, la pagina de sin conexion y los iconos. Si falla, el sitio sale igual.
      - name: Dejar lista la app instalable
        run: python publicar_app.py --salida _sitio --indice indice.json || echo "::warning::No se armo la app instalable"

      # La copia de las cotizaciones (K2): lo que usa la calculadora cuando no hay red o una fuente cae y,
      # desde el feed, el dolar con el que se estima el costo puesto en casa de las compras internacionales (spec 012). Si ninguna
      # responde, el sitio sale igual y la pagina las pide en vivo.
      - name: Dejar la copia de las cotizaciones
        run: python generar_cotizaciones.py --salida _sitio/cotizaciones.json || echo "::warning::No se genero la copia de las cotizaciones"

      # El feed RSS de ofertas y la lista para Telegram. Si falla, el sitio sale igual.
      - name: Armar el feed de ofertas
        run: |
          if [ -f indice.json ]; then
            node generar_feed.js --indice indice.json --salida _sitio || echo "::warning::No se armo el feed de ofertas"
          fi

      # Segundo chequeo, justo antes de publicar: se vuelve a abrir el enlace de las ofertas elegidas (pasaron minutos
      # desde el primero) y se rearma el feed con la siguiente candidata si alguna cayo. Hasta 3 rondas. Ante la duda
      # (bloqueo, sin red) se publica. Si falla, queda el feed de recien.
      - name: Verificar que las ofertas sigan en pie
        continue-on-error: true
        timeout-minutes: 15
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          if [ -f indice.json ] && [ -f _sitio/ofertas.json ]; then
            echo '[]' > descartadas.json
            for ronda in 1 2 3; do
              rc=0
              python verificar_ofertas.py _sitio/ofertas.json --descartadas descartadas.json --telemetria telemetria.json || rc=$?
              [ "$rc" -eq 3 ] || break
              node generar_feed.js --indice indice.json --salida _sitio --descartadas descartadas.json
            done
          fi

      # Fiabilidad del dato por comercio (fiabilidad.py): de lo que cada verificacion de arriba reviso, cuantas ofertas
      # estaban en pie, caidas o con otro precio y sin comprobar. Se suma una fila por comercio y dia a
      # historial/verificacion/AAAA-MM.csv (rama `historial`, no main) y se resume la ventana de 30 dias en
      # _sitio/fiabilidad.json, que lee /estado/. Un push a main no suma filas (reusa el indice de la cache: no es una
      # revision del dia) pero si resume la historia. Si falla, el sitio sale igual.
      - name: Contar la fiabilidad por comercio
        continue-on-error: true
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          args=""
          if [ "$EVENTO" != "push" ] && [ -f telemetria.json ]; then args="--telemetria telemetria.json"; fi
          python fiabilidad.py $args --historial historial --salida _sitio/fiabilidad.json

      - name: Guardar la fiabilidad por comercio en el historial
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin filas nuevas de fiabilidad"
          else
            git commit -m "Fiabilidad por comercio del $(TZ=America/Argentina/Buenos_Aires date +%F)"
            git push
          fi

      # /estado/ (cuando se relevo cada tienda, de indice.json y salud.json) y /legal/. Si falla, el sitio sale igual.
      - name: Armar las paginas de estado y legales
        run: node generar_info.js --indice indice.json --salud salud.json --fiabilidad _sitio/fiabilidad.json --salida _sitio || echo "::warning::No se armaron /estado/ ni /legal/"

      # Guardia del indice (guardia.js): mide sobre el indice real bajas propias y, por categoria, avisos, "sin datos" y
      # ofertas, y lo compara con la medicion publicada de la corrida anterior. Con una alarma (18/10: 0 bajas propias
      # en todo el indice) no se manda Telegram y se abre o comenta un issue con la etiqueta "guardia".
      # El mensaje de Telegram que ya salio viaja con el sitio (spec 030): se copia antes de la guardia para que no se
      # pierda si con alarma no se publica, o si un push no tiene que corregir nada.
      - name: Conservar el mensaje de Telegram anterior
        run: |
          base=$(python -c 'import json;print(json.load(open("sitio.json"))["base_url"])')
          curl -fsSL "$base/telegram.json" -o telegram-previo.json || echo '{}' > telegram-previo.json
          python -c 'import json,shutil; json.load(open("telegram-previo.json")).get("message_id") and shutil.copy("telegram-previo.json", "_sitio/telegram.json")' || echo '{}' > telegram-previo.json

      - name: Guardia del indice
        id: guardia
        continue-on-error: true
        run: |
          base=$(python -c 'import json;print(json.load(open("sitio.json"))["base_url"])')
          curl -fsSL "$base/guardia.json" -o guardia-previa.json || echo '{}' > guardia-previa.json
          rc=0
          node guardia.js --indice indice.json --salida _sitio/guardia.json --previa guardia-previa.json --ofertas _sitio/ofertas.json --alarma alarma.md --resumen "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -eq 3 ]; then echo "alarma=true" >> "$GITHUB_OUTPUT"; fi

      - name: Avisar la alarma de la guardia
        if: steps.guardia.outputs.alarma == 'true' && github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create guardia --color b60205 --description "La guardia del indice encontro algo que no cierra" --force
          echo "" >> alarma.md
          echo "Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No se mandó Telegram." >> alarma.md
          n=$(gh issue list --label guardia --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file alarma.md
          else gh issue create --title "Guardia del índice: algo no cierra" --label guardia --body-file alarma.md; fi

      # Opcional: sin los secretos TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID no hace nada. Un mensaje por indice: la
      # corrida programada y la que se lanza a mano lo mandan; un push nunca manda uno nuevo (asi no se repiten
      # mensajes en cada merge), pero si republica el mismo indice con otra lista corrige el que ya salio (spec 030,
      # 23/10: /hoy/ se arreglo a las 22:51 y el mensaje de las 22:06 siguio con la Lenovo repetida). Que mensaje
      # salio para que indice viaja con el sitio en telegram.json.
      - name: Publicar las pichinchas del dia en Telegram
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && steps.guardia.outputs.alarma != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENTO: ${{ github.event_name }}
        run: |
          modo=""
          if [ "$EVENTO" = "push" ]; then modo="--solo-corregir"; fi
          python publicar_telegram.py _sitio/ofertas.json --previo telegram-previo.json --estado _sitio/telegram.json $modo

      # Cuanto del indice se pudo agrupar por codigo de modelo, por rubro. Avisa en el resumen si cae.
      - name: Medir la cobertura por codigo de modelo
        run: |
          python cobertura.py indice.json --salida _sitio/cobertura.json --previa "$(python -c 'import json;print(json.load(open("sitio.json"))["base_url"])')/cobertura.json" --resumen "$GITHUB_STEP_SUMMARY" --historial historial || echo "::warning::No se midio la cobertura por modelo"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - id: desplegar
        uses: actions/deploy-pages@v5
