name: Mercado Libre prueba de la API

# Temporal (spec 026): corre la fuente Mercado Libre sola contra la API real. Solo lee. Se borra antes del PR.
on:
  push:
    branches: [claude/ml-api-directo]
    paths: [.github/workflows/ml-prueba.yml, mercadolibre.py]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Indexar solo Mercado Libre
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          mkdir -p /tmp/historial
          time python indexar.py --solo mercadolibre --historial /tmp/historial
          python - <<'PY'
          import json, collections
          d = json.load(open("indice.json", encoding="utf-8"))
          filas = [f for f in d["productos"] if f[3] == "mercadolibre"]
          print("filas", len(filas), "con tachado", sum(1 for f in filas if f[5]), "con modelo", sum(1 for f in filas if f[9]))
          for f in filas[:3] + [f for f in filas if f[5]][:5]:
              print(f[0][:70], "|", f[1], "| lista", f[5], "|", f[2][:90], "| modelo", f[9])
          PY
