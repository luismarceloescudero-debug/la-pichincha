name: Mercado Libre prueba de la API

# Temporal (spec 026): mide que endpoints responden con el token de aplicacion. Solo lee. Se borra antes del PR.
on:
  push:
    branches: [claude/ml-api-directo]
    paths: [.github/workflows/ml-prueba.yml]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Endpoints
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          API = "https://api.mercadolibre.com"
          datos = urllib.parse.urlencode({"grant_type": "client_credentials", "client_id": os.environ["ML_CLIENT_ID"],
                                          "client_secret": os.environ["ML_CLIENT_SECRET"]}).encode()
          with urllib.request.urlopen(urllib.request.Request(f"{API}/oauth/token", data=datos, method="POST",
                                      headers={"Content-Type": "application/x-www-form-urlencoded"}), timeout=30) as r:
              t = json.loads(r.read())
          token = t["access_token"]
          print("token: scope", t.get("scope"), "expira", t.get("expires_in"))
          def get(ruta, con=True):
              h = {"Accept": "application/json", **({"Authorization": f"Bearer {token}"} if con else {})}
              try:
                  with urllib.request.urlopen(urllib.request.Request(API + ruta, headers=h), timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
          import urllib.parse as up
          terminos = ["notebook", "monitor", "placa de video", "procesador", "memoria ram", "ssd", "motherboard",
                      "fuente de alimentacion pc", "gabinete pc", "celular", "teclado mecanico", "mouse gamer",
                      "auriculares gamer", "webcam"]
          for t in terminos:
              c, b = get("/sites/MLA/domain_discovery/search?limit=3&q=" + up.quote(t), False)
              doms = [(d.get("domain_id"), d.get("category_id")) for d in json.loads(b)] if c == 200 else b[:200]
              c2, b2 = get(f"/products/search?status=active&site_id=MLA&limit=50&q=" + up.quote(t))
              d2 = json.loads(b2) if c2 == 200 else {}
              res = d2.get("results", [])
              print(f"
## {t}: dominios {doms} | search {c2} total {d2.get('paging')} n={len(res)} dominios_res {sorted(set(r.get('domain_id') for r in res))[:6]}")
          for ruta in ["/products/search?status=active&site_id=MLA&limit=50&offset=50&q=ssd",
                       "/products/search?status=active&site_id=MLA&limit=50&offset=950&q=ssd",
                       "/products/search?status=active&site_id=MLA&limit=100&q=ssd",
                       "/products/search?status=active&site_id=MLA&limit=10&domain_id=MLA-HARD_DRIVES_AND_SSDS&q=ssd"]:
              c, b = get(ruta)
              d = json.loads(b) if c == 200 else {}
              print(f"
=== {c} {ruta} paging {d.get('paging')} n={len(d.get('results', []))} {'' if c == 200 else b[:200]}")
          c, b = get("/products/search?status=active&site_id=MLA&limit=1&q=ssd%20kingston%20nv3%201tb")
          prod = json.loads(b)["results"][0]
          print("
=== producto ejemplo", json.dumps({k: prod.get(k) for k in ("id", "name", "domain_id", "status", "pictures", "main_features")}, ensure_ascii=False)[:900])
          c, b = get(f"/products/{prod['id']}/items?limit=100")
          d = json.loads(b)
          print(f"
=== items {c} paging {d.get('paging')}")
          for it in d.get("results", [])[:6]:
              print(json.dumps({k: it.get(k) for k in ("item_id", "price", "original_price", "currency_id", "condition", "international_delivery_mode", "listing_type_id", "official_store_id", "tags", "deal_ids", "shipping")}, ensure_ascii=False)[:600])
          c, b = get(f"/products/{prod['id']}")
          d = json.loads(b)
          print("
=== producto detalle claves", sorted(d.keys()))
          print(json.dumps({k: d.get(k) for k in ("buy_box_winner", "pictures", "short_description", "permalink")}, ensure_ascii=False)[:700])
          PY
