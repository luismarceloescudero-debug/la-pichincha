name: Instagram prueba del token

# Temporal (spec 025): comprueba que INSTAGRAM_TOKEN sirve, sin publicar nada. Se borra antes del PR.
on:
  push:
    branches: [claude/instagram-diario-499f5e]
    paths: [.github/workflows/instagram-prueba.yml]

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Cuenta y permiso de publicar
        env:
          TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER: ${{ vars.INSTAGRAM_USER_ID }}
        run: |
          echo "Largo del token: ${#TOKEN}"
          echo "--- /me"
          curl -sS -G https://graph.instagram.com/v23.0/me \
            --data-urlencode "fields=user_id,username,account_type,media_count" \
            --data-urlencode "access_token=$TOKEN"
          echo
          echo "--- content_publishing_limit"
          curl -sS -G "https://graph.instagram.com/v23.0/$IG_USER/content_publishing_limit" \
            --data-urlencode "fields=config,quota_usage" \
            --data-urlencode "access_token=$TOKEN"
          echo
