<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>La Pichincha</title>
<!-- solo-web -->
<meta name="description" content="Comparador de hardware en Argentina: busca en 5 fuentes, arma la comparativa y te dice qué conviene comprar, no solo qué es más barato.">
<link rel="canonical" href="https://luismarceloescudero-debug.github.io/la-pichincha/">
<script id="gc" data-goatcounter="https://mescudero.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif;background:#fcfcfa}img{max-width:100%}[hidden]{display:none!important}</style>
<!-- /solo-web -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de pestanas fija, grilla de tarjetas verticales por vista, y
   una vista de analisis que entra por encima al tocar una tarjeta. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eceff4;
  --ink:#14181f; --ink-2:#4e5767; --ink-3:#78839a; --line:#d9dfe8;
  --accent:#0b4fd8; --accent-soft:#e3ecff;
  --good:#117a4a; --good-soft:#dff3e8; --bad:#a52020;
  --cg:#6534e8; --cg-soft:#efe9ff;
  --gc:#0b7f80; --gc-soft:#d8f2f2;
  --mx:#a85a07; --mx-soft:#fbeeda;
  --fh:#4e5767; --fh-soft:#e7eaf0;
  --cy:#b0265f; --cy-soft:#fbe4ee;
  --font-sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(20,24,31,.05), 0 8px 24px -12px rgba(20,24,31,.18);
  --shadow-up:0 2px 4px rgba(20,24,31,.06), 0 20px 44px -16px rgba(20,24,31,.3);
  --curva:cubic-bezier(.2,.75,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b23; --surface-2:#1e242e; --ink:#e9edf4; --ink-2:#aab3c2;
    --ink-3:#7c8799; --line:#2b323d; --accent:#6c9bff; --accent-soft:#1a2740;
    --good:#4ec98b; --good-soft:#12301f; --bad:#ef8080;
    --cg:#a78bfa; --cg-soft:#241c3d; --gc:#5eead4; --gc-soft:#0f2d2c;
    --mx:#fbbf24; --mx-soft:#2e2311; --fh:#aab3c2; --fh-soft:#232a35;
    --cy:#f9a8d4; --cy-soft:#3a1024;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-up:0 2px 4px rgba(0,0,0,.5), 0 20px 44px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b23; --surface-2:#1e242e; --ink:#e9edf4; --ink-2:#aab3c2;
  --ink-3:#7c8799; --line:#2b323d; --accent:#6c9bff; --accent-soft:#1a2740;
  --good:#4ec98b; --good-soft:#12301f; --bad:#ef8080;
  --cg:#a78bfa; --cg-soft:#241c3d; --gc:#5eead4; --gc-soft:#0f2d2c;
  --mx:#fbbf24; --mx-soft:#2e2311; --fh:#aab3c2; --fh-soft:#232a35;
  --cy:#f9a8d4; --cy-soft:#3a1024;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-up:0 2px 4px rgba(0,0,0,.5), 0 20px 44px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
.c-cg{--c:var(--cg);--c-soft:var(--cg-soft)}
.c-gc{--c:var(--gc);--c-soft:var(--gc-soft)}
.c-mx{--c:var(--mx);--c-soft:var(--mx-soft)}
.c-fh{--c:var(--fh);--c-soft:var(--fh-soft)}
.c-cy{--c:var(--cy);--c-soft:var(--cy-soft)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:26px 64px}
h1{font-size:clamp(1.55rem,4vw,2.1rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:1.2rem;margin:0 0 4px;letter-spacing:-.02em;text-wrap:balance}
h3{margin:0;font-size:1.02rem;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--ink-2);margin:0;max-width:66ch;font-size:.94rem}
.meta{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.11em;margin:0 0 10px}
.ico{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes entraPanel{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes entraDetalle{from{opacity:0;transform:translateY(22px) scale(.99)}to{opacity:1;transform:none}}

/* ---- Pestanas ---- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:4px;position:relative;overflow-x:auto;scrollbar-width:none;
  background:var(--surface-2);border-radius:12px;padding:4px}
.tablist::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;flex:1 1 auto;text-align:center;white-space:nowrap;
  padding:9px 16px;border-radius:9px;font-size:.9rem;font-weight:500;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:color .22s var(--curva),background .22s var(--curva)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tab .n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);
  background:var(--bg);border-radius:5px;padding:0 5px}
.tab[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}

.panel{animation:entraPanel .32s var(--curva) both}
.panel-head{margin-bottom:18px}

/* ---- Grilla de tarjetas verticales ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:18px;align-items:start}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:0 0 20px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;
  animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*80ms);
  transition:transform .28s var(--curva),box-shadow .28s,border-color .28s}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:var(--shadow-up);border-color:var(--c)}
.card.dest{border-color:var(--good)}
.card .barra{height:5px;background:var(--c);flex:none}
.card.dest .barra{background:var(--good)}
.cinta{position:absolute;top:5px;right:0;background:var(--good);color:#fff;
  font:600 .65rem/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
  padding:7px 12px;border-bottom-left-radius:11px;display:flex;align-items:center;gap:5px;z-index:2}
:root[data-theme="dark"] .cinta{color:#0e1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cinta{color:#0e1117}}
.card .foto{height:150px;background:#fff;padding:14px;flex:none;overflow:hidden;
  border-bottom:1px solid var(--line)}
.card .foto img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .35s var(--curva)}
.card:hover .foto img{transform:scale(1.07)}
.card .cuerpo{padding:16px 20px 0;display:flex;flex-direction:column;gap:9px;flex:1}
.rank{position:absolute;top:19px;left:14px;font-family:var(--font-mono);font-size:.92rem;font-weight:700;
  color:var(--c);background:var(--c-soft);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;z-index:2}
.card.dest .rank{color:var(--good);background:var(--good-soft)}
.tienda{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c);
  background:var(--c-soft);border-radius:999px;padding:3px 11px;font-size:.78rem;width:max-content}
.titular{color:var(--ink-2);font-size:.89rem;margin:0}
.precio{font-family:var(--font-mono);font-size:1.62rem;font-weight:700;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--c);line-height:1.1}
.card.dest .precio{color:var(--good)}
.antes{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-3);text-decoration:line-through;margin-left:7px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 .71rem/1.7 var(--font-mono);padding:1px 8px;border-radius:6px;
  background:var(--surface-2);color:var(--ink-2)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.pie{margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ver{font-size:.84rem;font-weight:600;color:var(--c);display:inline-flex;align-items:center;gap:5px;
  transition:gap .2s var(--curva)}
.card:hover .ver{gap:9px}
.ir{font-size:.78rem;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.ir:hover{color:var(--accent)}

/* ---- Vista de analisis ---- */
.detalle{animation:entraDetalle .36s var(--curva) both}
.volver{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:.88rem;
  font-weight:600;color:var(--accent);margin-bottom:16px;padding:7px 13px;border-radius:9px;
  background:var(--accent-soft);transition:gap .2s var(--curva)}
.volver:hover{gap:11px}
.dcab{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;
  background:var(--surface);border:1px solid var(--c);border-radius:16px;padding:20px 24px;
  box-shadow:var(--shadow);margin-bottom:18px}
.dfoto{width:92px;height:92px;background:#fff;border-radius:12px;border:1px solid var(--line);
  padding:8px;flex:none;overflow:hidden}
.dfoto img{width:100%;height:100%;object-fit:contain;display:block}
.dsku{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-3);margin:4px 0 8px}
.dprecio{text-align:right;white-space:nowrap}
.dprecio .v{font-family:var(--font-mono);font-size:1.75rem;font-weight:700;letter-spacing:-.035em;
  color:var(--c);display:block;font-variant-numeric:tabular-nums}
.dprecio .l{font-size:.76rem;color:var(--ink-3);display:block;margin-top:3px}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-bottom:18px}
.bloque{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  box-shadow:var(--shadow);min-width:0}
.bloque h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.lista li{color:var(--ink-2);padding-left:23px;position:relative}
.lista li::before{position:absolute;left:0;top:0;font-family:var(--font-mono);font-weight:700}
.lista li.p::before{content:"\2191";color:var(--good)}
.lista li.m::before{content:"\2193";color:var(--bad)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--surface-2);font-size:.71rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
thead th.foco{color:var(--c)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody th{font-weight:500;color:var(--ink-2);font-size:.84rem;white-space:nowrap}
td{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.84rem;color:var(--ink-2)}
td.foco{color:var(--ink);font-weight:700;background:var(--c-soft)}
td.mejor{color:var(--good);font-weight:700}

/* ---- Tiendas ---- */
.wins{margin:12px 0 0;padding:0;list-style:none}
.wins li{border-top:1px dashed var(--line)}
.wins li:first-child{border-top:0}
.wins a{display:flex;align-items:center;gap:12px;padding:9px 10px;margin-inline:-10px;border-radius:10px;
  text-decoration:none;color:inherit;font-size:.88rem;transition:background .18s,padding-left .18s}
.wins a:hover{background:var(--c-soft);padding-left:16px}
.wins .mini{width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid var(--line);
  padding:3px;flex:none;overflow:hidden}
.wins .mini img{width:100%;height:100%;object-fit:contain;display:block}
.wins .txt{flex:1;color:var(--ink-2);min-width:0}
.wins b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--good);font-weight:700}
.flaco{margin:14px 0 0;font-size:.87rem;color:var(--ink-2);padding:11px 13px;background:var(--surface-2);
  border-radius:10px;display:flex;gap:9px;align-items:flex-start}
.flaco .ico{color:var(--bad);margin-top:3px}

/* ---- Veredicto ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
  box-shadow:var(--shadow);animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*70ms)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile .k{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;letter-spacing:-.03em;margin:3px 0 1px;
  font-variant-numeric:tabular-nums}
.tile.ok .v{color:var(--good)}
.tile .d{font-size:.82rem;color:var(--ink-2)}
.ver-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  margin-bottom:12px;box-shadow:var(--shadow);
  animation:entra .45s var(--curva) both;animation-delay:calc(var(--i,0)*70ms)}
.ver-item b{display:block;margin-bottom:5px}
.ver-item p{margin:0;color:var(--ink-2);font-size:.92rem}
.nota{margin-top:30px;font-size:.81rem;color:var(--ink-3);max-width:74ch}
.nota code{font-family:var(--font-mono);font-size:.95em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* ---- Buscador ---- */
.buscador{position:relative;margin-bottom:18px}
.buscador input{width:100%;font:500 1.05rem var(--font-sans);padding:15px 18px 15px 50px;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.buscador input:focus{outline:none;border-color:var(--accent);box-shadow:var(--shadow-up)}
.buscador .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:1.2rem;color:var(--ink-3)}
.sugeridas{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.sug{all:unset;cursor:pointer;font:500 .82rem var(--font-sans);padding:6px 13px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);transition:background .18s,color .18s}
.sug:hover{background:var(--accent-soft);color:var(--accent)}
.estado{color:var(--ink-3);font-size:.9rem;margin:0 0 14px;font-family:var(--font-mono)}
.res{display:flex;flex-direction:column;gap:8px}
.fila{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--c);border-radius:12px;padding:13px 16px;text-decoration:none;color:inherit;
  animation:entra .3s var(--curva) both;animation-delay:calc(var(--i,0)*18ms);
  transition:transform .18s var(--curva),box-shadow .18s,border-color .18s}
.fila:hover{transform:translateX(4px);box-shadow:var(--shadow);border-color:var(--c);border-left-color:var(--c)}
.fila.top{border-color:var(--good);border-left-color:var(--good);background:var(--good-soft)}
.fila .nom{flex:1;min-width:0;font-size:.92rem;line-height:1.35}
.fila .tie{font:600 .72rem/1 var(--font-mono);color:var(--c);background:var(--c-soft);
  padding:5px 10px;border-radius:999px;white-space:nowrap}
.fila .via{color:var(--ink-3);font-weight:500}
.fila .via::before{content:"\203A ";opacity:.7}
.fila .pre{font-family:var(--font-mono);font-weight:700;font-size:1.02rem;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.fila.top .pre{color:var(--good)}
.fila .marca{background:var(--good);color:#fff;font:600 .64rem/1 var(--font-mono);letter-spacing:.07em;
  text-transform:uppercase;padding:5px 9px;border-radius:6px;white-space:nowrap}
:root[data-theme="dark"] .fila .marca{color:#0e1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fila .marca{color:#0e1117}}
@media (max-width:620px){
  .fila{flex-wrap:wrap;gap:9px}
  .fila .nom{flex:1 1 100%;order:1}
  .fila .tie{order:2}.fila .marca{order:3}.fila .pre{order:4;margin-left:auto}
}

/* ---- Barra de exportacion ---- */
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.acc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font:600 .83rem var(--font-sans);padding:9px 14px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--shadow);
  transition:transform .18s var(--curva),border-color .18s,color .18s,background .18s}
.acc:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.acc[data-ok="1"]{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.acc .ico{font-size:1.05rem}

/* ---- Indicio de que las pestanas se deslizan ----
   Ojo: no poner position aca, pisaria el sticky de la barra. */
.tabs::after{content:"";position:absolute;right:0;top:12px;bottom:13px;width:34px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg));opacity:0;transition:opacity .2s}
.tabs[data-desborda="1"]::after{opacity:1}

/* ---- Impresion: queda solo el contenido ---- */
@media print{
  .tabs,.acciones,.buscador,.sugeridas,.volver,noscript,.nota{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .fila,.card,.st,.bloque,.tile,.ver-item,.scroll{break-inside:avoid;box-shadow:none;
    border:1px solid #bbb!important;background:#fff!important;color:#000!important;animation:none!important}
  .fila{border-left-width:4px!important}
  .fila .nom,.fila .pre,.precio,h1,h2,h3,td,th,.lista li,.titular{color:#000!important}
  .fila .tie,.chip,.tienda{background:#f0f0f0!important;color:#333!important}
  a{text-decoration:none;color:#000!important}
  .fila .pre::after{content:""}
  .pie-impresion{display:block!important}
}
.pie-impresion{display:none}

/* ---- Selector de categoria dentro de Comparativa ---- */
.segmentos{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;
  margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.segmentos::-webkit-scrollbar{display:none}
.seg{all:unset;cursor:pointer;flex:1 1 auto;text-align:center;white-space:nowrap;padding:9px 16px;
  border-radius:9px;font:500 .88rem var(--font-sans);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:7px;transition:all .22s var(--curva)}
.seg:hover{color:var(--ink)}
.seg[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.seg .n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);background:var(--bg);
  border-radius:5px;padding:0 5px}
.seg[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}

/* ---- Ofertas ---- */
.oferta{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--c);border-radius:12px;padding:13px 16px;text-decoration:none;color:inherit;
  animation:entra .3s var(--curva) both;animation-delay:calc(var(--i,0)*22ms);

/* --- Indice compartido: lo usan Buscar y Ofertas ---------------------
   Se baja una sola vez, recien cuando abris alguna de las dos. */
let IDX = null, pidiendo = null, OFERTAS = null;
const SUGERIDAS = ["ddr4 16gb", "ssd 1tb", "rtx 4060", "ryzen 5", "monitor 27", "fuente 650w", "webcam logitech"];

function asegurarIndice(forzar) {
  if (IDX && !forzar) return Promise.resolve(IDX);
  if (pidiendo && !forzar) return pidiendo;
  // no-cache revalida; reload ignora la copia local y trae la del servidor.
  pidiendo = fetch("indice.json", { cache: forzar ? "reload" : "no-cache" })
    .then(r => r.json())
    .then(j => {
      IDX = j;
      OFERTAS = calcularOfertas(j);
      document.querySelectorAll(".tab[data-ir='buscar'] .n").forEach(n => { n.textContent = j.productos.length; });
      document.querySelectorAll(".tab[data-ir='ofertas'] .n").forEach(n => { n.textContent = OFERTAS.propias.length + OFERTAS.publicadas.length; });
      return j;
    })
    .finally(() => { pidiendo = null; });
  return pidiendo;
}

/* --- Ofertas: tarjetas que se filtran, se ordenan y se abren ------------
   Dos señales distintas:
   1. Bajas propias: lo que valia en el relevamiento anterior contra lo que vale
      hoy. No depende de lo que publique la tienda y no se puede inflar.
   2. Rebajas publicadas: el precio tachado del comercio. Solo Gaming City y
      ComparaYa lo usan como rebaja real, y se acota entre 15% y 60% porque
      arriba de ahi el precio anterior suele estar inventado. */
const PISO_OFERTA = 15000, DESCUENTO_MIN = 0.15, DESCUENTO_MAX = 0.6;
const BAJA_MIN_PCT = 0.03, BAJA_MIN_PESOS = 1000;
const POR_PAGINA = 24;
const OF = { tipo: "todas", orden: "descuento", com: "", cat: "", primera: false, marcadas: false, pagina: 1 };
let OF_ACTUAL = [];

const leerEstrellas = () => {
  try { return new Set(JSON.parse(localStorage.getItem("estrellas") || "[]")); } catch (e) { return new Set(); }
};
let ESTRELLAS = leerEstrellas();

function calcularOfertas(idx) {
  const propias = [], publicadas = [];
  for (const f of idx.productos) {
    const ayer = f[6] || 0;
    if (ayer > f[1] && ayer - f[1] >= BAJA_MIN_PESOS && 1 - f[1] / ayer >= BAJA_MIN_PCT) {
      propias.push(f);
      continue;                       // una baja propia ya es noticia: no la repito abajo
    }
    const lista = f[5] || 0;
    if (!lista || lista <= f[1] || f[1] < PISO_OFERTA) continue;
    const off = 1 - f[1] / lista;
    if (off >= DESCUENTO_MIN && off <= DESCUENTO_MAX) publicadas.push(f);
  }
  return { propias, publicadas };     // sin recortar: la vista filtra y pagina
}

function listaOfertas() {
  if (!OFERTAS) return [];
  if (OFERTAS._lista) return OFERTAS._lista;
  const nuevo = (f, ref, tipo) => ({ f, ref, tipo, off: 1 - f[1] / f[ref], ahorro: f[ref] - f[1],
    niv: nivelMarca(f[0]), cat: categoriaDe(f[0]), com: comercioDe(f) });
  return (OFERTAS._lista = [...OFERTAS.propias.map(f => nuevo(f, 6, "propia")),
                            ...OFERTAS.publicadas.map(f => nuevo(f, 5, "publicada"))]);
}

function ofertasFiltradas() {
  let l = listaOfertas();
  if (OF.tipo !== "todas") l = l.filter(o => o.tipo === OF.tipo);
  if (OF.com) l = l.filter(o => o.com === OF.com);
  if (OF.cat) l = l.filter(o => o.cat === OF.cat);
  if (OF.primera) l = l.filter(o => o.niv === 2);
  if (OF.marcadas) l = l.filter(o => ESTRELLAS.has(o.f[2]));
  const por = { descuento: (a, b) => b.off - a.off, ahorro: (a, b) => b.ahorro - a.ahorro,
                precio: (a, b) => a.f[1] - b.f[1] }[OF.orden];
  // Cuando se ven todas, las bajas propias van primero: son la señal mas confiable.
  return [...l].sort((a, b) => OF.tipo === "todas" && a.tipo !== b.tipo ? (a.tipo === "propia" ? -1 : 1) : por(a, b));
}

function controlesOfertas(todas) {
  const n = { todas: todas.length, propia: todas.filter(o => o.tipo === "propia").length };
  n.publicada = n.todas - n.propia;
  const seg = (k, v, txt, cnt) => `<button class="seg" data-of="${k}:${v}" aria-selected="${OF[k] === v}">${txt}${cnt != null ? ` <span class="n">${cnt}</span>` : ""}</button>`;
  const cuenta = key => {
    const m = new Map();
    todas.forEach(o => m.set(o[key], (m.get(o[key]) || 0) + 1));
    return [...m].sort((a, b) => b[1] - a[1]);
  };
  const coms = cuenta("com").slice(0, 6);
  // "Outlet" o "Combo" son condiciones del aviso, no rubros.
  const NO_RUBRO = ["outlet", "combo", "kit", "nuevo", "oferta", "usado"];
  const cats = cuenta("cat").filter(([c, k]) => k >= 5 && c.length > 2 && !NO_RUBRO.includes(c)).slice(0, 8);
  const chip = (k, v, txt, cnt, on) => `<button class="of-chip" data-of="${k}:${esc(v)}" aria-pressed="${on}">${esc(txt)} <span class="n">${cnt}</span></button>`;
  return `<div class="of-ctrl">
    <div class="segmentos chico">${seg("tipo", "todas", "Todas", n.todas)}${seg("tipo", "propia", "Bajaron de precio", n.propia)}${seg("tipo", "publicada", "Rebajas publicadas", n.publicada)}</div>
    <div class="segmentos chico">${seg("orden", "descuento", "Mayor descuento")}${seg("orden", "ahorro", "Mayor ahorro $")}${seg("orden", "precio", "Menor precio")}</div>
    <div class="of-fila"><span class="of-et">Comercio</span>${coms.map(([c, k]) => chip("com", c, c, k, OF.com === c)).join("")}</div>
    <div class="of-fila"><span class="of-et">Rubro</span>${cats.map(([c, k]) => chip("cat", c, c[0].toUpperCase() + c.slice(1), k, OF.cat === c)).join("")}</div>
    <div class="of-fila">
      <button class="of-chip" data-of="primera:1" aria-pressed="${OF.primera}">${icono("trofeo")} Solo primera línea</button>
      <button class="of-chip" data-of="marcadas:1" aria-pressed="${OF.marcadas}">★ Marcadas <span class="n">${ESTRELLAS.size}</span></button>
    </div></div>`;
}

    <div class="o-ahorro">Ahorrás <b>${pesos(o.ahorro)}</b></div>
    <div class="o-detalle"><div class="o-in">
      <div class="chips">${specs.map(v => `<span class="chip">${esc(v)}</span>`).join("")}<span class="chip${o.niv === 2 ? " ok" : ""}">${nivTxt}</span></div>
      <p>${origen}</p></div></div>
    <div class="o-acciones">
      <a class="acc" href="${f[2]}" target="_blank" rel="noopener">${icono("fuera")} Abrir</a>

  </article>`;

function animarCuentas() {
  const reducir = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".ocard:not(.quieta) .o-off b[data-n]").forEach(b => {
    const n = +b.dataset.n;
    if (reducir) return;
    const t0 = performance.now();
    const paso = t => {
      const k = Math.min(1, (t - t0) / 650);
      b.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))) + "%";
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
}

function vistaOfertas() {
  setTimeout(async () => {
    try { await asegurarIndice(); pintarOfertas(); }
    catch (e) { const el = $("#estadoOf"); if (el) el.textContent = "no pude cargar el índice"; }
  }, 0);
  return `<div class="panel"><div class="panel-head"><h2>${icono("fuego")} Ofertas imperdibles</h2>
    <p class="sub">Dos señales distintas. Las que <b>bajaron de precio</b> las detecta la propia app comparando contra el relevamiento anterior,
    así que no dependen de lo que publique la tienda. Las <b>rebajas publicadas</b> son el precio tachado del comercio: una referencia, no una verdad.
    Tocá una tarjeta para ver el detalle.</p></div>
    <p class="estado" id="estadoOf">buscando rebajas…</p>
    ${barraAcciones("ofertas")}
    <div id="resOf"></div></div>`;
}

function pintarOfertas(append) {
  const caja = $("#resOf"), est = $("#estadoOf");
  if (!caja || !IDX) return;
  const todas = listaOfertas();
  if (!todas.length) {
    const sinCampo = !(IDX.campos || []).includes("antes");
    est.textContent = sinCampo ? "el índice todavía no registra precios anteriores" : "no hay rebajas en este relevamiento";
    caja.innerHTML = sinCampo ? `<p class="sub">Hace falta volver a indexar con <code>python indexar.py</code>.</p>`
                              : `<p class="sub">Volvé mañana: el índice se rearma todos los días a las 09:00.</p>`;
    return;
  }
  OF_ACTUAL = ofertasFiltradas();
  const visibles = OF_ACTUAL.slice(0, OF.pagina * POR_PAGINA);
  const desde = append ? (OF.pagina - 1) * POR_PAGINA : 0;
  const ahorro = OF_ACTUAL.reduce((a, o) => a + o.ahorro, 0);
  est.textContent = `${OF_ACTUAL.length} ofertas`
    + (OF_ACTUAL.length ? ` · ahorro promedio ${pesos(ahorro / OF_ACTUAL.length)} por producto` : "");
  const resto = OF_ACTUAL.length - visibles.length;
  caja.innerHTML = controlesOfertas(todas)
    + (visibles.length
      ? `<div class="ogrid">${visibles.map((o, i) => cardOferta(o, i, desde)).join("")}</div>`
        + (resto > 0 ? `<div class="mas"><button class="acc" data-of="mas:1">Ver ${Math.min(POR_PAGINA, resto)} más · quedan ${resto}</button></div>` : "")
      : `<p class="sub">Ninguna oferta coincide con esos filtros. Probá sacando alguno.</p>`);
  animarCuentas();
}

function ofertasAccion(el) {
  const raw = el.dataset.of, i = raw.indexOf(":");
  const k = raw.slice(0, i), v = raw.slice(i + 1);
  if (k === "mas") { OF.pagina++; return pintarOfertas(true); }
  if (k === "tipo" || k === "orden") OF[k] = v;
  else if (k === "com" || k === "cat") OF[k] = OF[k] === v ? "" : v;
  else if (k === "primera") OF.primera = !OF.primera;
  else if (k === "marcadas") OF.marcadas = !OF.marcadas;
  OF.pagina = 1;
  pintarOfertas();
}

function marcarEstrella(btn) {
  const u = btn.dataset.estrella;
  if (ESTRELLAS.has(u)) ESTRELLAS.delete(u); else ESTRELLAS.add(u);
  try { localStorage.setItem("estrellas", JSON.stringify([...ESTRELLAS].slice(-200))); } catch (e) { /* sin storage no persiste */ }
  if (OF.marcadas) return pintarOfertas();
  btn.classList.toggle("on", ESTRELLAS.has(u));
  btn.textContent = ESTRELLAS.has(u) ? "★" : "☆";
  const n = document.querySelector("[data-of='marcadas:1'] .n");
  if (n) n.textContent = ESTRELLAS.size;
}

/* "Comparar" desde una oferta: busca la categoria y la marca, sin el codigo de modelo,
   y abre la comparativa de esos resultados. */
function compararOferta(i) {
  const o = OF_ACTUAL[i];
  if (!o) return;
  const palabras = o.f[0].split(/\s+/).filter(w => w.length >= 2 && !/\d/.test(w));
  compararConsulta((palabras.slice(0, 3).join(" ") || o.f[0].split(/\s+/).slice(0, 2).join(" ")));
}

/* --- Historial de busquedas: vive solo en este navegador --------------
   Cada entrada guarda, ademas del texto, la mejor compra de ese momento. Asi,
   cuando volves, se ve si el precio se movio desde la ultima vez. */
const TOPE_HIST = 8;
function leerHistCompleto() {
  try {
    const nuevo = JSON.parse(localStorage.getItem("hist2") || "null");
    if (Array.isArray(nuevo)) return nuevo.filter(x => x && typeof x.q === "string");
    const viejo = JSON.parse(localStorage.getItem("hist") || "[]");   // formato anterior: solo textos
    return viejo.filter(x => typeof x === "string").map(q => ({ q }));
  } catch (e) { return []; }
}
const leerHist = () => leerHistCompleto().map(h => h.q);
function escribirHist(h) { try { localStorage.setItem("hist2", JSON.stringify(h)); } catch (e) { /* sin storage no persiste */ } }

function guardarHist(q) {
  q = (q || "").trim();
  if (q.length < 2) return;
  const previo = leerHistCompleto();
  const ya = previo.find(x => x.q === q);
  const mejor = ANALISIS && CONSULTA === q ? ANALISIS.picks[0].m.f : null;
  const entrada = { ...(ya || {}), q, t: Date.now() };
  if (mejor) { entrada.p = mejor[1]; entrada.n = mejor[0].slice(0, 90); entrada.c = comercioDe(mejor); }
  escribirHist([entrada, ...previo.filter(x => x.q !== q)].slice(0, TOPE_HIST));
  pintarHist();
  pintarTira();
}
function olvidar(q) {
  escribirHist(leerHistCompleto().filter(x => x.q !== q));
  pintarHist();
  pintarTira();
}
function pintarHist() {
  const caja = $("#hist");
  if (!caja) return;
  const h = leerHist();
  caja.innerHTML = !h.length ? "" :
    `<span class="et">${icono("reloj")} tus búsquedas</span>` + h.map(q =>
      `<button class="hist" data-rep="${esc(q)}">${esc(q)}<span class="x" data-olvidar="${esc(q)}" title="Quitar">×</span></button>`).join("") +
    `<button class="hist" data-refrescar="1">${icono("refrescar")} actualizar precios</button>`;
}

/* Precio de hoy de la mejor compra de una busqueda guardada. */
function fotoVivaDe(q) {
  if (!IDX) return null;
  if (CONSULTA === q && ANALISIS) { const f = ANALISIS.picks[0].m.f; return { p: f[1], n: f[0], c: comercioDe(f) }; }
  IDX._h = IDX._h || {};
  if (!(q in IDX._h)) {
    const A = analizarConsulta(q);
    IDX._h[q] = A ? { p: A.picks[0].m.f[1], n: A.picks[0].m.f[0], c: comercioDe(A.picks[0].m.f) } : null;
  }
  return IDX._h[q];
}

/* La tira de la pestaña Comparativa: las curadas y tus ultimas busquedas. */
function tiraHtml(conPrecios) {
  const hist = leerHistCompleto();
  const curadas = CATEGORIAS.map(c =>
    `<button class="ult curada${!CONSULTA && c.id === CAT ? " activa" : ""}" data-cat="${c.id}">
      <span class="ult-q">${icono(c.ico)} ${esc(c.eti)}</span><span class="ult-sub">análisis a fondo</span></button>`).join("");
  const buscadas = hist.map(h => {
    const vivo = conPrecios ? fotoVivaDe(h.q) : null;
    let delta = "";
    if (vivo && h.p && Math.abs(vivo.p / h.p - 1) >= 0.01) {
      const x = Math.round((vivo.p / h.p - 1) * 100);
      delta = `<span class="ult-d ${x < 0 ? "baja" : "sube"}">${x < 0 ? "▼" : "▲"} ${Math.abs(x)}% desde que lo viste</span>`;
    }
    const precio = vivo ? `<span class="ult-p">${pesos(vivo.p)}</span>` : h.p ? `<span class="ult-p tenue">${pesos(h.p)}</span>` : "";
    return `<button class="ult${CONSULTA === h.q ? " activa" : ""}" data-comparar="${esc(h.q)}">
      <span class="ult-q">${icono("lupa")} ${esc(h.q)}</span>${precio}${delta}
      <span class="ult-sub">${esc(((vivo && vivo.n) || h.n || "").slice(0, 38))}</span>
      <span class="ult-x" data-olvidar="${esc(h.q)}" title="Quitar">×</span></button>`;
  }).join("");
  return `<div class="ult-cab">${icono("reloj")} ${hist.length ? "Comparaciones: curadas y tus últimas búsquedas" : "Comparaciones curadas. Tus búsquedas van a aparecer acá"}</div>
    <div class="ult-fila">${curadas}${buscadas}</div>`;
}
function pintarTira() {

/* Abre la comparativa de una busqueda guardada sin pasar por el buscador. */
async function compararConsulta(q) {

/* --- Que tan reconocida es la marca ------------------------------------
   Es juicio editorial y esta en datos.json, no en el indice: ninguna tienda
   publica esto. Lo que no esta en la lista no se castiga, solo no se destaca. */
const MARCAS = DATOS.marcas || { primera: [], conocida: [] };
const reMarca = lista => lista.length
  ? new RegExp("\\b(" + lista.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b")
  : /$^/;
const RE_PRIMERA = reMarca(MARCAS.primera || []), RE_CONOCIDA = reMarca(MARCAS.conocida || []);
const _niv = new Map();
const nivelMarca = nombre => {
  let v = _niv.get(nombre);
  if (v === undefined) {
    const n = normal(nombre);
    v = RE_PRIMERA.test(n) ? 2 : RE_CONOCIDA.test(n) ? 1 : 0;
    _niv.set(nombre, v);
  }
  return v;
};

const ORDENES = [
  { id: "recomendado", eti: "Recomendado" },
  { id: "precio", eti: "Más barato" },
  { id: "marca", eti: "Mejor marca" },
];
let ORDEN = (() => { try { return localStorage.getItem("orden") || "recomendado"; } catch (e) { return "recomendado"; } })();

/* "Recomendado" pone primero la marca mas confiable al menor precio y manda al
   fondo el piso de gama. La logica vive en js/buscador.js. */
function ordenar(filas, med) { return Buscador.ordenar(filas, med, ORDEN, nivelMarca); }

function buscarTodo(q) {
  const coincide = Buscador.filtroDe(q);
  if (!IDX || !coincide) return [];
  // Los nombres normalizados se calculan una sola vez por indice cargado.
  const N = IDX._n || (IDX._n = IDX.productos.map(f => normalBusq(f[0])));
  const halla = [];
  IDX.productos.forEach((f, i) => { if (coincide(N[i])) halla.push(f); });
  return halla;
}

function buscar(q, tope = 60) { return buscarTodo(q).slice(0, tope * 3); }

let ULTIMA_BUSQUEDA = [];

function pintarResultados(q) {
  const caja = $("#res"), est = $("#estado");
  if (!IDX || !caja) return;

  if (!q.trim()) {
    est.textContent = `${IDX.productos.length.toLocaleString("es-AR")} productos indexados en ${Object.keys(IDX.tiendas).length} fuentes · actualizado ${IDX.generado}`;
    caja.innerHTML = "";
    $("#puente").innerHTML = "";
    ULTIMA_BUSQUEDA = [];
    return;
  }
  const crudo = buscarTodo(q);   // se ordena sobre TODO el catalogo, no sobre los primeros 180
  if (!crudo.length) {
    est.textContent = `sin resultados para "${q}"`;
    caja.innerHTML = `<p class="sub">Probá con menos palabras, o con la marca sola. El índice busca por nombre de producto.</p>`;
    $("#puente").innerHTML = "";
    ULTIMA_BUSQUEDA = [];
    return;
  }
  // La busqueda arma la comparativa, el ranking de comercios y el veredicto, y la
  // lista usa el mismo conjunto: sin equipos completos ni avisos que no son
  // comparables, para que la mediana y el orden digan lo mismo que las pestañas.
  fijarConsulta(q);
  const A = ANALISIS;
  const conjunto = A ? A.base.map(m => m.f) : crudo;
  const med = A ? A.med : mediana(crudo.map(f => f[1]));
  const r = ordenar(conjunto, med).slice(0, 60);
  ULTIMA_BUSQUEDA = r;

  const fuentes = new Set(r.map(f => f[3]));
  const conMarca = r.filter(f => nivelMarca(f[0]) === 2).length;
  const afuera = A ? A.total - A.base.length : 0;
  est.innerHTML = (conjunto.length > r.length ? `Mostrando ${r.length} de ${conjunto.length}` : `${r.length} resultado${r.length > 1 ? "s" : ""}`)
    + ` en ${fuentes.size} fuente${fuentes.size > 1 ? "s" : ""}`
    + ` · mediana ${pesos(med)} · ${conMarca} de marca de primera línea`
    + (afuera ? ` · ${afuera} avisos quedaron afuera por no ser comparables (el detalle está en Comparativa)` : "");
  const cat = CATEGORIAS.find(c => (c.claves || []).some(k => normal(q).includes(normal(k))));
  $("#puente").innerHTML = !A ? "" :
    `<div class="puente">
      <div class="p-txt">
        <span class="p-tit">${icono("balanza")} Armamos la comparación para «${esc(q.trim())}»</span>
        <span>Mejor compra: <b>${esc(A.picks[0].m.f[0].slice(0, 64))}</b> · ${pesos(A.picks[0].m.f[1])} · ${esc(comercioDe(A.picks[0].m.f))}</span>
      </div>
      <div class="botones">
        <button class="acc" data-ir-vista="comparativa">${icono("balanza")} Comparativa</button>
        <button class="acc" data-ir-vista="tiendas">${icono("store")} Tiendas</button>
        <button class="acc" data-ir-vista="veredicto">${icono("trofeo")} Veredicto</button>
      </div>
    </div>` + (!cat ? "" :
    `<div class="puente suave"><span>Esta categoría también tiene análisis a fondo: specs de fábrica y garantía real.</span>
      <button class="acc" data-ir-cat="${cat.id}">Ver el análisis curado de ${esc(cat.eti)}</button></div>`);

  const barato = Math.min(...r.map(f => f[1]));
  caja.innerHTML = r.map((f, i) => {
    const t = IDX.tiendas[f[3]] || { nombre: f[3], color: "fh" };
    const sello = f[4] ? `${esc(t.nombre)} <span class="via">${esc(f[4])}</span>` : esc(t.nombre);
    const niv = nivelMarca(f[0]);
    const bajo = f[6] && f[6] > f[1] ? Math.round((1 - f[1] / f[6]) * 100) : 0;
    const off = f[5] && f[5] > f[1] ? Math.round((1 - f[1] / f[5]) * 100) : 0;
    const sospechoso = pisoDeGama(f[1], niv, med);
    const marcas = [];
    if (niv === 2) marcas.push('<span class="sello primera">primera línea</span>');
    else if (niv === 1) marcas.push('<span class="sello conocida">marca conocida</span>');
    if (bajo) marcas.push(`<span class="sello baja">bajó ${bajo}%</span>`);
    else if (off) marcas.push(`<span class="sello off2">${off}% OFF</span>`);
    if (sospechoso) marcas.push('<span class="sello ojo">muy por debajo del resto</span>');
    if (f[1] === barato && ORDEN === "precio") marcas.push('<span class="sello barato">más barato</span>');
    return `<a class="fila c-${t.color}${i === 0 ? " top" : ""}" style="--i:${i}" href="${f[2]}" target="_blank" rel="noopener">
      <span class="nom">${esc(f[0])}${marcas.length ? `<span class="sellos">${marcas.join("")}</span>` : ""}</span>
      <span class="tie">${sello}</span>
      <span class="pre">${pesos(f[1])}</span>
    </a>`;
  }).join("");
}

/* --- Exportar y compartir ---------------------------------------------
   En la web funciona todo. Dentro de un visor embebido el navegador bloquea
   la impresion y las descargas, asi que ahi solo se ofrece lo que si anda. */
const SUELTA = (() => { try { return window.self === window.top; } catch (e) { return false; } })();

function avisar(boton, texto) {
  const previo = boton.innerHTML;
  boton.innerHTML = `${icono("check")} ${texto}`;
  boton.dataset.ok = "1";
  setTimeout(() => { boton.innerHTML = previo; delete boton.dataset.ok; }, 1800);
}

async function copiar(texto, boton) {
  try {
    await navigator.clipboard.writeText(texto);
    avisar(boton, "copiado");
  } catch (e) {                      // sin permiso de portapapeles: lo dejo seleccionable
    const ta = document.createElement("textarea");
    ta.value = texto; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); avisar(boton, "copiado"); }
    catch (_) { avisar(boton, "copiá a mano"); }
    ta.remove();
  }
}

/* En la web se baja con un enlace. Dentro del visor de Claude eso esta
   bloqueado, pero la pagina puede pedir la descarga por la capacidad
   downloads, que le muestra al visitante una confirmacion. */
let DESCARGAS = null;
(async () => {
  try { DESCARGAS = (await window.claude?.use?.("downloads")) || null; } catch (e) { DESCARGAS = null; }
  document.querySelectorAll('[data-acc="excel"]').forEach(b => { b.hidden = !(SUELTA || DESCARGAS); });
})();

async function bajarArchivo(nombre, contenido, tipo, boton) {
  if (DESCARGAS) {
    try {
      await DESCARGAS.save({ filename: nombre, data: new Blob([contenido], { type: tipo }) });
      return avisar(boton, "descargado");
    } catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") return avisar(boton, "probá de nuevo");
      if (!SUELTA) return avisar(boton, "no disponible acá");
    }
  }
  if (!SUELTA) return avisar(boton, "no disponible acá");
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement("a");
  a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const csvCampo = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;

function aCSV(filas) {
  // Punto y coma y BOM: asi Excel en español lo abre en columnas sin preguntar nada.
  const cab = ["Producto", "Precio", "Fuente", "Comercio", "Enlace"];
  const cuerpo = filas.map(f => {
    const t = (IDX && IDX.tiendas[f[3]]) || { nombre: f[3] };
    return [f[0], f[1], t.nombre, f[4] || "", f[2]].map(csvCampo).join(";");
  });
  return "\uFEFF" + [cab.map(csvCampo).join(";"), ...cuerpo].join("\r\n");
}

function aTexto(filas, titulo) {
  const lineas = filas.slice(0, 20).map((f, i) => {
    const t = (IDX && IDX.tiendas[f[3]]) || { nombre: f[3] };
    return `${i + 1}. ${f[0]} — ${pesos(f[1])} · ${t.nombre}${f[4] ? " (" + f[4] + ")" : ""}\n   ${f[2]}`;
  });
  return `${titulo}\n${"—".repeat(Math.min(titulo.length, 40))}\n\n${lineas.join("\n")}` +
    (filas.length > 20 ? `\n\n…y ${filas.length - 20} más` : "") +
    `\n\nLa Pichincha · ${enlaceActual()}`;
}

async function compartir(titulo, texto, boton) {
  if (navigator.share) {
    try { await navigator.share({ title: titulo, text: texto }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  copiar(texto, boton);
}

function barraAcciones(id) {
  const b = [`<button class="acc" data-acc="compartir" data-de="${id}">${icono("compartir")} Compartir</button>`,
             `<button class="acc" data-acc="copiar" data-de="${id}">${icono("copiar")} Copiar</button>`];
  b.push(`<button class="acc" data-acc="excel" data-de="${id}"${SUELTA || DESCARGAS ? "" : " hidden"}>${icono("tabla")} Excel</button>`);
  if (SUELTA) b.push(`<button class="acc" data-acc="imprimir" data-de="${id}">${icono("imprimir")} Imprimir o PDF</button>`);
  return `<div class="acciones">${b.join("")}</div>`;
}

/* Que se exporta segun la vista en la que estes. */
function materia(de) {
  if (CONSULTA && ANALISIS && DINAMICAS.includes(de))
    return { filas: ANALISIS.picks.map(p => p.m.f), titulo: `«${CONSULTA}»: mejor compra y alternativas`,
             archivo: "comparativa-" + normal(CONSULTA).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") };
  if (de === "buscar") {
    const q = ($("#q") || {}).value || "";
    return { filas: ULTIMA_BUSQUEDA, titulo: q ? `Búsqueda: ${q}` : "La Pichincha", archivo: "busqueda" };
  }
  const p = porId[de];
  if (p) {
    const t = T[p.tienda];
    return {
      filas: [[p.nombre, p.precio, p.url, p.tienda]],
      titulo: `${p.nombre} — ${pesos(p.precio)} en ${t.nombre}`,
      archivo: p.id,
    };
  }
  if (de === "ofertas") return { filas: ofertasFiltradas().map(o => o.f), titulo: "Ofertas imperdibles", archivo: "ofertas" };
  const c = CATEGORIAS.find(x => x.id === CAT) || CATEGORIAS[0];
  return {
    filas: c.lista.map(x => [x.nombre, x.precio, x.url, x.tienda]),
    titulo: c.titulo,
    archivo: c.id,
  };
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-acc]");
  if (!b) return;
  const m = materia(b.dataset.de);
  if (!m.filas.length) return avisar(b, "nada para exportar");
  const hoy = new Date().toISOString().slice(0, 10);
  const base = `la-pichincha-${m.archivo}-${hoy}`;

  if (b.dataset.acc === "excel") {
    const previo = b.innerHTML;
    b.innerHTML = `${icono("tabla")} armando…`;
    try {
      await cargarExcel();
      b.innerHTML = previo;
      await bajarArchivo(`${base}.xlsx`, await aXLSX(m.filas, m.titulo),
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", b);
      medir(Pagina.eventoAccion("excel", b.dataset.de));
    } catch (e) {                      // sin CDN no hay libro, pero el CSV sirve igual
      b.innerHTML = previo;
      await bajarArchivo(`${base}.csv`, aCSV(m.filas), "text/csv;charset=utf-8", b);
      medir(Pagina.eventoAccion("csv", b.dataset.de));
    }
  }
  else if (b.dataset.acc === "imprimir") { medir(Pagina.eventoAccion("imprimir", b.dataset.de)); window.print(); }
  else if (b.dataset.acc === "copiar") { medir(Pagina.eventoAccion("copiar", b.dataset.de)); copiar(aTexto(m.filas, m.titulo), b); }
  else { medir(Pagina.eventoAccion("compartir", b.dataset.de)); compartir(m.titulo, aTexto(m.filas, m.titulo), b); }
});

/* --- Libro de Excel nativo -------------------------------------------
   ExcelJS pesa 257 KB comprimido, asi que se baja recien cuando pedis el
   archivo, no en cada visita. Si el CDN no responde, cae en CSV. */
const EXCEL_URL = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
let excelPromesa = null;

function cargarExcel() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if (!excelPromesa) {
    excelPromesa = new Promise((listo, falla) => {
      const et = document.createElement("script");
      et.src = EXCEL_URL;
      et.onload = () => (window.ExcelJS ? listo(window.ExcelJS) : falla(new Error("sin ExcelJS")));
      et.onerror = () => { excelPromesa = null; falla(new Error("no cargo")); };
      document.head.appendChild(et);
    });
  }
  return excelPromesa;
}

const TINTA = "FF14181F", BORDE = "FFD9DFE8", CEBRA = "FFF4F6F9",
      GANA = "FFDFF3E8", GANA_TINTA = "FF117A4A", ENLACE = "FF0B4FD8";

async function aXLSX(filas, titulo) {
  const libro = new window.ExcelJS.Workbook();
  libro.creator = "La Pichincha";
  libro.created = new Date();

  const hoja = libro.addWorksheet("Ofertas", {
    views: [{ state: "frozen", ySplit: 1 }],          // la cabecera queda fija al scrollear
    pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 },
  });
  hoja.columns = [
    { header: "Producto", key: "p", width: 62 },
    { header: "Precio", key: "v", width: 14, style: { numFmt: '"$"#,##0' } },
    { header: "Fuente", key: "f", width: 16 },
    { header: "Comercio", key: "c", width: 20 },
    { header: "Enlace", key: "u", width: 56 },
  ];

  const cab = hoja.getRow(1);
  cab.height = 24;
  cab.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 11 };
  cab.alignment = { vertical: "middle" };
  cab.eachCell(c => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: TINTA } }; });

  filas.forEach((f, i) => {
    const t = (IDX && IDX.tiendas[f[3]]) || T[f[3]] || { nombre: f[3] };
    const fila = hoja.addRow({ p: f[0], v: f[1], f: t.nombre, c: f[4] || "", u: null });
    fila.getCell("u").value = { text: f[2], hyperlink: f[2] };
    fila.getCell("u").font = { color: { argb: ENLACE }, underline: true };
    fila.getCell("p").alignment = { wrapText: true, vertical: "top" };
    fila.getCell("v").alignment = { horizontal: "right" };
    fila.eachCell(c => { c.border = { bottom: { style: "thin", color: { argb: BORDE } } }; });
    if (i === 0) {                                    // el mas barato, resaltado
      fila.font = { bold: true, color: { argb: GANA_TINTA } };
      fila.getCell("u").font = { color: { argb: ENLACE }, underline: true, bold: true };
      fila.eachCell(c => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: GANA } }; });
    } else if (i % 2 === 1) {
      fila.eachCell(c => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: CEBRA } }; });
    }
  });
  hoja.autoFilter = { from: { row: 1, column: 1 }, to: { row: filas.length + 1, column: 5 } };

  const info = libro.addWorksheet("Info");
  info.columns = [{ width: 16 }, { width: 64 }];
  const titulo1 = info.addRow(["La Pichincha"]);
  titulo1.font = { bold: true, size: 16, color: { argb: TINTA } };
  const sub = info.addRow(["Hardware en Argentina. No lo más barato: lo que más rinde."]);
  sub.font = { italic: true, color: { argb: "FF4E5767" } };
  info.addRow([]);
  [["Exportado", new Date().toLocaleString("es-AR")],
   ["Selección", titulo],
   ["Productos", filas.length],
   ["Precios de", DATOS.actualizado],
   ["Sitio", location.origin + location.pathname]].forEach(([k, v]) => {
    const r = info.addRow([k, v]);
    r.getCell(1).font = { bold: true };
  });
  info.addRow([]);
  info.addRow(["", "Son los precios de transferencia o depósito de cada tienda, con IVA y sin envío."]);
  info.addRow(["", "Verificá en la web antes de pagar: el hardware se mueve rápido."]);

  return libro.xlsx.writeBuffer();
}

/* --- Una busqueda arma su propia comparativa, ranking y veredicto -------
   Antes la busqueda era una lista y las otras pestañas mostraban siempre lo
   mismo. Ahora lo que buscas gobierna las tres: la comparativa sale de los
   resultados, el ranking de comercios sale de los resultados y el veredicto
   lo escribe la propia busqueda. Sin consulta vuelve el contenido curado. */
let CONSULTA = "", ANALISIS = null;
const DINAMICAS = ["comparativa", "tiendas", "veredicto"];
const LETRAS = ["A", "B", "C", "D"];
const MARCAS_RE = Buscador.armarMarcasRe([...(MARCAS.primera || []), ...(MARCAS.conocida || [])]);

const comercioDe = f => f[4] || (IDX.tiendas[f[3]] || {}).nombre || f[3];
const colorDe = f => (IDX.tiendas[f[3]] || {}).color || "fh";

/* La marca es la que aparece primero en el nombre: "Notebook HP Intel Core" es HP. */
function marcaDe(nombre) { return Buscador.marcaDe(nombre, MARCAS_RE); }

function analizarConsulta(q) {
  const crudo = buscarTodo(q);
  if (!crudo.length) return null;
  const nq = normalBusq(q);
  const toks = nq.split(/\s+/).filter(Boolean);
  const excl = { formato: 0, usados: 0, equipos: 0, similares: 0, accesorios: 0, tipo: 0, raros: 0, caros: 0 };
  const meta = crudo.map(f => ({ f, n: normalBusq(f[0]), niv: nivelMarca(f[0]) }));

  const utiles = meta.filter(m => {
    const motivo = motivoExclusion(m.n, nq, toks);
    if (motivo) { excl[motivo]++; return false; }
    return true;
  });
  if (!utiles.length) return null;

  // Lo que cuesta menos del 45% de la mediana y no tiene marca reconocida casi
  // nunca es el mismo tipo de producto. Si quedan pocos, no filtro mas.
  // Tambien lo que cuesta mas de 3 veces la mediana: buscando "ddr4 16gb" entran
  // notebooks y PCs completas que mencionan esa memoria en el nombre.
  const med1 = mediana(utiles.map(m => m.f[1]));
  const muyBarato = m => m.niv === 0 && m.f[1] < med1 * 0.45;
  const muyCaro = m => m.f[1] > med1 * 3;
  const sinExtremos = utiles.filter(m => !muyBarato(m) && !muyCaro(m));
  const base = sinExtremos.length >= 3 ? sinExtremos : utiles;
  excl.raros = base === sinExtremos ? utiles.filter(muyBarato).length : 0;
  excl.caros = base === sinExtremos ? utiles.filter(muyCaro).length : 0;
  const med = mediana(base.map(m => m.f[1]));

  const piso = m => pisoDeGama(m.f[1], m.niv, med);
  const rec = [...base].sort((a, b) => (piso(a) - piso(b)) || (b.niv - a.niv) || (a.f[1] - b.f[1]));
  const porPrecio = [...base].sort((a, b) => a.f[1] - b.f[1]);
  const mejor = rec[0];
  const barato = porPrecio[0] === mejor ? null : porPrecio[0];
  const marcaMejor = marcaDe(mejor.f[0]);
  const alt = rec.find(m => {
    if (m === mejor || m === barato || m.f[1] > mejor.f[1] * 1.6) return false;
    const ma = marcaDe(m.f[0]);
    return ma && ma !== marcaMejor;
  }) || null;
  const baja = base
    .filter(m => m.f[6] > m.f[1] && m !== mejor && m !== barato && m !== alt)
    .sort((a, b) => (1 - b.f[1] / b.f[6]) - (1 - a.f[1] / a.f[6]))[0] || null;

  const bajoMed = m => Math.round((1 - m.f[1] / med) * 100);
  const textoMed = m => { const x = bajoMed(m);
    return x === 0 ? "justo en la mediana" : `${Math.abs(x)}% ${x > 0 ? "por debajo" : "por encima"} de la mediana`; };

  const picks = [];
  picks.push({ clave: "mejor", ico: "trofeo", m: mejor,
    rol: barato ? "Mejor compra" : "Mejor compra y más barata", rolCorto: "Mejor compra",
    razon: `${mejor.niv === 2 ? "La marca más confiable" : mejor.niv === 1 ? "La marca más conocida" : "La mejor ubicada"} entre las opciones, al menor precio dentro de ese nivel: ${textoMed(mejor)} (mediana ${pesos(med)}).`
      + (barato ? "" : " Además es la más barata de todas.") });
  if (barato) picks.push({ clave: "barato", ico: "flechaAbajo", m: barato, rol: "Más barata", rolCorto: "Más barata",
    razon: `La más barata de las comparables: ${pesos(mejor.f[1] - barato.f[1])} menos (${Math.round((1 - barato.f[1] / mejor.f[1]) * 100)}%) que la mejor compra.`
      + (barato.niv === 0 ? " No reconocemos la marca: mirá garantía y reseñas antes de pagar." : "")
      + (piso(barato) ? " Está muy por debajo de lo habitual: puede ser un modelo viejo o de entrada." : "") });
  if (alt) { const dp = Math.round((alt.f[1] / mejor.f[1] - 1) * 100);
    picks.push({ clave: "alt", ico: "balanza", m: alt, rol: "Alternativa de otra marca", rolCorto: "Otra marca",
      razon: `Otra marca (${marcaDe(alt.f[0])}) para no depender de una sola: ${Math.abs(dp)}% ${dp >= 0 ? "más cara" : "más barata"} que la mejor compra.` }); }
  if (baja) picks.push({ clave: "baja", ico: "fuego", m: baja, rol: "Bajó de precio", rolCorto: "Bajó de precio",
    razon: `Bajó ${Math.round((1 - baja.f[1] / baja.f[6]) * 100)}% desde el relevamiento anterior: antes ${pesos(baja.f[6])}.` });

  // Si la busqueda tiene una sola marca no hay "otra marca" que contrastar. En
  // vez de dejar una tarjeta sola, muestro un escalon arriba y la gama alta.
  const en = new Set(picks.map(p => p.m));
  const pctSobre = m => Math.round((m.f[1] / mejor.f[1] - 1) * 100);
  if (picks.length < 3) {
    const escalon = rec.find(m => !en.has(m) && !piso(m) && m.niv >= 1 && m.f[1] >= mejor.f[1] * 1.3);
    if (escalon) { en.add(escalon); picks.push({ clave: "escalon", ico: "subir", m: escalon,
      rol: "Un escalón más arriba", rolCorto: "Un escalón arriba",
      razon: `${pctSobre(escalon)}% más cara que la mejor compra. Fijate qué trae de más en las especificaciones antes de pagar la diferencia.` }); }
  }
  if (picks.length < 3) {
    const alta = [...base].filter(m => !en.has(m) && m.niv === 2).sort((a, b) => b.f[1] - a.f[1])[0];
    if (alta && alta.f[1] > mejor.f[1] * 1.3) { en.add(alta); picks.push({ clave: "alta", ico: "subir", m: alta,
      rol: "Gama alta", rolCorto: "Gama alta",
      razon: `La más cara de primera línea: ${pctSobre(alta)}% sobre la mejor compra. Solo si necesitás esas prestaciones.` }); }
  }

  // Ranking de comercios: cada comercio de ComparaYa cuenta por separado.
  const mapa = new Map();
  for (const m of base) {
    const nom = comercioDe(m.f);
    let c = mapa.get(nom);
    if (!c) mapa.set(nom, c = { nom, color: colorDe(m.f), items: [] });
    c.items.push(m);
  }
  const comercios = [...mapa.values()].map(c => {
    const primeras = c.items.filter(m => m.niv === 2);
    const mejorItem = [...(primeras.length ? primeras : c.items)].sort((a, b) => a.f[1] - b.f[1])[0];
    return { ...c, n: c.items.length, med: mediana(c.items.map(m => m.f[1])),
      conPrimera: primeras.length > 0, pctPrimera: primeras.length / c.items.length, mejorItem,
      bajas: c.items.filter(m => m.f[6] > m.f[1]).length };
  }).sort((a, b) => (b.conPrimera - a.conPrimera) || (a.mejorItem.f[1] - b.mejorItem.f[1]));

  return { q, total: crudo.length, base, med, picks, comercios, excl,
           primeras: base.filter(m => m.niv === 2) };
}

function fijarConsulta(q) {
  const t = q.trim();
  if (t.length < 2) return limpiarConsulta();
  CONSULTA = t;
  ANALISIS = analizarConsulta(t);
  if (!ANALISIS) CONSULTA = "";
  marcarConsulta();
}
function limpiarConsulta() { CONSULTA = ""; ANALISIS = null; marcarConsulta(); }
function marcarConsulta() {
  const t = $(".tabs"); if (t) t.dataset.consulta = CONSULTA ? "1" : "0";
  sincronizarUrl();
}

/* ---- Vistas ---- */
function bannerConsulta() {
  const A = ANALISIS, ex = A.excl, partes = [];
  if (ex.formato) partes.push(`${ex.formato} de notebook`);
  if (ex.equipos) partes.push(`${ex.equipos} equipos completos (notebooks, PCs, combos)`);
  if (ex.similares) partes.push(`${ex.similares} que dicen «simil» y no son lo que buscás`);
  if (ex.accesorios) partes.push(`${ex.accesorios} accesorios (cables, adaptadores, soportes)`);
  if (ex.tipo) partes.push(`${ex.tipo} de otro tipo de producto`);
  if (ex.usados) partes.push(`${ex.usados} usados u outlet`);
  if (ex.raros) partes.push(`${ex.raros} muy por debajo del resto y sin marca conocida`);
  if (ex.caros) partes.push(`${ex.caros} que cuestan más del triple (suelen ser equipos completos)`);
  return `<div class="consulta-activa"><span class="txt">${icono("lupa")} Armado para tu búsqueda <b>«${esc(CONSULTA)}»</b>:
    ${A.total} avisos, ${A.base.length} comparables en ${A.comercios.length} comercios.${partes.length ? ` Dejamos afuera ${partes.join(", ")}.` : ""}</span>
    <button class="acc" data-cambiar-consulta>${icono("lupa")} Cambiar búsqueda</button>
    <button class="acc" data-quitar-consulta>Ver el análisis curado</button></div>`;
}

function cardPick(p, i) {
  const f = p.m.f, t = IDX.tiendas[f[3]] || { nombre: f[3], color: "fh" };
  const specs = Object.values(specsDe(f[0])).slice(0, 5);
  const sello = ["sin marca reconocida", "marca conocida", "primera línea"][p.m.niv];
  const antes = f[5] && f[5] > f[1] ? `<span class="antes">${pesos(f[5])}</span>` : "";
  return `<a class="dcard c-${t.color}${p.clave === "mejor" ? " mejor" : ""}" style="--i:${i}" href="${f[2]}" target="_blank" rel="noopener">
    <span class="rol"><b class="letra">${LETRAS[i]}</b> ${icono(p.ico)} ${esc(p.rol)}</span>
    <h3>${esc(f[0])}</h3>
    <span class="tienda">${icono("store")} ${esc(comercioDe(f))}${f[4] ? ` · vía ${esc(t.nombre)}` : ""}</span>
    <div><span class="precio">${pesos(f[1])}</span>${antes}</div>
    <div class="chips">${specs.map(v => `<span class="chip">${esc(v)}</span>`).join("")}<span class="chip${p.m.niv === 2 ? " ok" : ""}">${sello}</span></div>
    <p class="razon">${esc(p.razon)}</p>
    <span class="ver">Abrir en ${esc(comercioDe(f))} ${icono("fuera")}</span>
  </a>`;
}

function franja(picks) {
  const ps = ANALISIS.base.map(m => m.f[1]).sort((a, b) => a - b);
  const lo = ps[0], hi = ps[Math.floor(0.95 * (ps.length - 1))], span = Math.max(1, hi - lo);
  const x = v => Math.min(97, Math.max(3, (v - lo) / span * 100)).toFixed(1);
  const marcas = picks.map((p, i) => `<span class="mk c-${colorDe(p.m.f)}" style="left:${x(p.m.f[1])}%"
    title="${esc(p.rol)}: ${pesos(p.m.f[1])}">${LETRAS[i]}</span>`).join("");
  return `<div class="franja"><h3>Dónde cae cada opción en el rango de precios</h3>
    <div class="pista"><span class="med" style="left:${x(ANALISIS.med)}%"></span>${marcas}</div>
    <div class="extremos"><span>${pesos(lo)} · el más barato</span><span>${pesos(hi)} · hasta acá llega el 95%</span></div></div>`;
}

function tablaPicks(picks) {
  const A = ANALISIS, med = A.med;
  const specs = picks.map(p => specsDe(p.m.f[0]));
  const claves = [...new Set(specs.flatMap(s => Object.keys(s)))];
  const precios = picks.map(p => p.m.f[1]), minP = Math.min(...precios);
  const maxNiv = Math.max(...picks.map(p => p.m.niv));
  const bajo = picks.map(p => Math.round((1 - p.m.f[1] / med) * 100)), maxBajo = Math.max(...bajo);
  const fila = (nombre, vals, mejor) => `<tr><th>${esc(nombre)}</th>${vals.map((v, i) =>
    `<td class="${mejor && mejor[i] ? "mejor" : ""}">${v}</td>`).join("")}</tr>`;
  let h = `<div class="scroll"><table><thead><tr><th>&nbsp;</th>${picks.map((p, i) =>
    `<th>${LETRAS[i]} · ${esc(p.rolCorto)}</th>`).join("")}</tr></thead><tbody>`;
  h += fila("Precio", picks.map(p => pesos(p.m.f[1])), precios.map(v => v === minP));
  h += fila("Comercio", picks.map(p => esc(comercioDe(p.m.f))));
  h += fila("Marca", picks.map(p => `${esc(marcaDe(p.m.f[0]) || "—")} <span class="tenue">(${["sin reconocer", "conocida", "primera línea"][p.m.niv]})</span>`),
    picks.map(p => p.m.niv === maxNiv && maxNiv > 0));
  h += fila("Contra la mediana", bajo.map(x => x === 0 ? "igual" : `${Math.abs(x)}% ${x > 0 ? "menos" : "más"}`), bajo.map(x => x === maxBajo));
  h += fila("Movimiento", picks.map(p => {
    const f = p.m.f;
    return f[6] > f[1] ? `bajó ${Math.round((1 - f[1] / f[6]) * 100)}%`
         : f[5] > f[1] ? `${Math.round((1 - f[1] / f[5]) * 100)}% OFF publicado` : "—";
  }));
  claves.forEach(k => { h += fila(k, specs.map(s => esc(s[k] || "—"))); });
  return h + "</tbody></table></div>";
}

function vistaComparativaDin() {
  const A = ANALISIS;
  setTimeout(pintarTira, 0);
  return `<div class="panel"><div class="ultimas" id="ultimas">${tiraHtml(true)}</div>${bannerConsulta()}
    <div class="panel-head"><h2>${icono("balanza")} Comparativa: ${esc(CONSULTA)}</h2>
      <p class="sub">De ${A.total} avisos que coinciden, ${A.base.length} son comparables entre sí. Estas son las opciones que valen la pena y en qué se diferencian.</p></div>
    ${barraAcciones("comparativa")}
    <div class="dgrid">${A.picks.map(cardPick).join("")}</div>

      <p class="sub">Las especificaciones se leen del texto del aviso, así que algunas pueden faltar: abrí la ficha para confirmarlas.</p></div>

function vistaTiendasDin() {
  const A = ANALISIS, top = A.comercios.slice(0, 6), resto = A.comercios.length - top.length;
  const cards = top.map((c, i) => `<a class="dcard c-${c.color}${i === 0 ? " mejor" : ""}" style="--i:${i}" href="${c.mejorItem.f[2]}" target="_blank" rel="noopener">
    <span class="rol"><b class="letra">${i + 1}</b> ${icono("store")} ${i === 0 ? "Más barata en primera línea" : "Comercio"}</span>

    <div><span class="precio">${pesos(c.mejorItem.f[1])}</span></div>
    <p class="razon">${c.conPrimera ? "Su opción de primera línea más barata" : "Sin marca de primera línea acá: su opción más barata"}: ${esc(c.mejorItem.f[0].slice(0, 80))}</p>
    <dl><dt>Avisos comparables</dt><dd>${c.n}</dd><dt>Precio típico</dt><dd>${pesos(c.med)}</dd>
      <dt>De primera línea</dt><dd>${Math.round(c.pctPrimera * 100)}%</dd><dt>Bajaron de precio</dt><dd>${c.bajas}</dd></dl>
    <span class="ver">Abrir ${icono("fuera")}</span></a>`).join("");

      <p class="sub">Ranking de comercios con lo que realmente vende cada uno de esta búsqueda. Gana quien tiene la marca más confiable al menor precio; el precio típico y la cantidad de avisos muestran cuánto margen de elección da.${resto > 0 ? ` Hay ${resto} comercio${resto > 1 ? "s" : ""} más con menos opciones.` : ""}</p></div>
    ${barraAcciones("tiendas")}
    <div class="dgrid">${cards}</div></div>`;

function vistaVeredictoDin() {
  const A = ANALISIS, mejor = A.picks[0], f = mejor.m.f;
  const barato = A.picks.find(p => p.clave === "barato"), alt = A.picks.find(p => p.clave === "alt");
  const x = Math.round((1 - f[1] / A.med) * 100);
  const c0 = A.comercios[0], c1 = A.comercios[1];
  const items = [];

  items.push({ t: `Comprá ${f[0].slice(0, 72)}.`,
    d: `${mejor.razon} Sale ${pesos(f[1])} en ${comercioDe(f)}.` + (f[6] > f[1] ? ` Además bajó ${Math.round((1 - f[1] / f[6]) * 100)}% desde el relevamiento anterior.` : "") });
  if (barato) items.push({ t: "Si el precio es lo único que importa.",
    d: `${barato.m.f[0].slice(0, 72)} a ${pesos(barato.m.f[1])}. ${barato.razon}` });
  if (alt) items.push({ t: "Una alternativa de otra marca.",
    d: `${alt.m.f[0].slice(0, 72)} a ${pesos(alt.m.f[1])}. ${alt.razon}` });
  items.push({ t: "Dónde conviene comprar.",
    d: `${c0.nom} tiene la opción ${c0.conPrimera ? "de primera línea" : "de menor precio"} más barata: ${pesos(c0.mejorItem.f[1])}.`
      + (c1 ? ` Le sigue ${c1.nom} con ${pesos(c1.mejorItem.f[1])}, ${Math.round((c1.mejorItem.f[1] / c0.mejorItem.f[1] - 1) * 100)}% más.` : "")
      + ` Hay ${A.comercios.length} comercio${A.comercios.length > 1 ? "s" : ""} con opciones comparables.` });

  const descartar = [];
  if (A.excl.raros) descartar.push(`${A.excl.raros} avisos cuestan menos del 45% de lo habitual y no son de una marca que reconozcamos: suelen ser otro producto, un accesorio o una variante inferior.`);
  if (A.excl.caros) descartar.push(`${A.excl.caros} avisos cuestan más del triple de lo habitual: casi siempre son equipos completos que solo mencionan el componente en el nombre.`);
  if (A.excl.similares) descartar.push(`${A.excl.similares} avisos dicen «simil» o «similar»: no son lo que buscaste, por más parecido que sea.`);
  const caras = A.primeras.map(m => m.f[1]);
  if (caras.length > 1) {
    const sobre = Math.round((Math.max(...caras) / f[1] - 1) * 100);
    if (sobre >= 25) descartar.push(`Entre las marcas de primera línea, la más cara cuesta ${sobre}% más que la mejor compra: antes de pagar esa diferencia, fijate si trae mejores especificaciones.`);
  }
  if (descartar.length) items.push({ t: "Lo que descartaría.", d: descartar.join(" ") });
  items.push({ t: "Lo que esta lectura no sabe.",
    d: "Sale del nombre y el precio de cada aviso. No ve garantía, reseñas ni especificaciones finas, y las especificaciones las lee del texto. Sirve para decidir a quién mirar primero, no para cerrar la compra sin abrir la ficha." });

  const tiles = [
    { k: "Mejor compra", v: pesos(f[1]), d: comercioDe(f), ok: true },
    { k: "Mediana de la búsqueda", v: pesos(A.med), d: `${A.base.length} avisos comparables` },
    { k: "Contra la mediana", v: `${x >= 0 ? "−" : "+"}${Math.abs(x)}%`, d: "la mejor compra frente a lo típico", ok: x > 0 },
    { k: "Comercios", v: String(A.comercios.length), d: "con opciones comparables" },
  ];
  return `<div class="panel">${bannerConsulta()}
    <div class="panel-head"><h2>${icono("trofeo")} Veredicto: ${esc(CONSULTA)}</h2>
      <p class="sub">Escrito a partir de los resultados de tu búsqueda, con los precios de hoy.</p></div>
    ${barraAcciones("veredicto")}
    <div class="tiles">${tiles.map((t, i) => `<div class="tile${t.ok ? " ok" : ""}" style="--i:${i}">
      <div class="k">${esc(t.k)}</div><div class="v">${t.v}</div><div class="d">${esc(t.d)}</div></div>`).join("")}</div>
    ${items.map((v, i) => `<div class="ver-item" style="--i:${i}"><b>${esc(v.t)}</b><p>${esc(v.d)}</p></div>`).join("")}</div>`;
}

function vistaDinamica(id) {
  return id === "comparativa" ? vistaComparativaDin()
       : id === "tiendas" ? vistaTiendasDin() : vistaVeredictoDin();
}

/* --- La busqueda va a la URL ---------------------------------------------
   ?q= guarda la consulta activa y el hash la pestaña: un link copiado
   reproduce la vista. replaceState para no llenar el historial al tipear. */
function sincronizarUrl() {
  const destino = Pagina.armarUrl(location.pathname, CONSULTA, location.hash.slice(1));
  if (destino === location.pathname + location.search + location.hash) return;
  try { history.replaceState(history.state, "", destino); } catch (e) { /* Safari limita las llamadas */ }
}

/* El link de lo que estas mirando: en Buscar vale lo que esta escrito. */
function enlaceActual() {
  const q = CONSULTA || ($("#q") || {}).value || "";
  return location.origin + Pagina.armarUrl(location.pathname, q, location.hash.slice(1));
}

/* --- Analitica: GoatCounter, sin cookies ni banner ------------------------
   El script es async: lo que se mide antes de que cargue espera en una cola.
   Si un bloqueador lo frena, los eventos se pierden sin romper nada. */
const COLA_GC = [];
function vaciarCola() {
  const gc = window.goatcounter;
  if (!gc || typeof gc.count !== "function") return;
  while (COLA_GC.length) { try { gc.count(COLA_GC.shift()); } catch (e) { /* no frena la pagina */ } }
}
function medir(ev) { if (ev) { COLA_GC.push(ev); vaciarCola(); } }
(() => { const s = document.getElementById("gc"); if (s) s.addEventListener("load", vaciarCola); })();

/* Una busqueda cuenta cuando se asienta, no por cada tecla. */
let ULTIMO_MEDIDO = "";
function registrarBusqueda(q) {
  const t = normalBusq(q || "").replace(/\s+/g, " ").trim();
  if (t.length < 2 || t === ULTIMO_MEDIDO || !IDX) return;
  ULTIMO_MEDIDO = t;
  medir(Pagina.eventoBusqueda(t, buscarTodo(q).length));
}

/* Clic hacia una tienda: el comercio sale del dominio y el rubro del producto,
   buscado por URL en el indice o en los curados. */
let RUBROS = null;
function rubroDeUrl(url) {
  if (!RUBROS || RUBROS.idx !== IDX) {
    const m = new Map();
    P.forEach(p => m.set(p.url, /^ram/.test(p.tipo) ? "memoria" : /^webcam/.test(p.tipo) ? "webcam" : "otro"));
    if (IDX) IDX.productos.forEach(f => { if (!m.has(f[2])) m.set(f[2], categoriaDe(f[0]) || "otro"); });
    RUBROS = { idx: IDX, m };
  }
  return RUBROS.m.get(url) || "otro";
}
function alClicSaliente(ev) {
  if (ev.type === "auxclick" && ev.button !== 1) return;
  const a = ev.target.closest && ev.target.closest("a[href]");
  if (!a || !/^https?:$/.test(a.protocol) || a.host === location.host) return;
  medir(Pagina.eventoClic(a.href, rubroDeUrl(a.getAttribute("href"))));
}
document.addEventListener("click", alClicSaliente, true);
document.addEventListener("auxclick", alClicSaliente, true);

/* Abrir un link con ?q=: se baja el indice, se arma la consulta y se muestra
   la pestaña del link. Sin resultados va al buscador con el termino escrito. */
async function abrirConsultaDeUrl(q, vista) {
  $("#vista").innerHTML = `<p class="sub">Armando la comparación de «${esc(q)}»…</p>`;
  try { await asegurarIndice(); } catch (e) { return aplicar(vista); }
  fijarConsulta(q);
  registrarBusqueda(q);
  // Se pinta ya y se reemplaza la entrada del historial en lugar de sumar una:
  // Atras vuelve a donde estaba la persona antes de abrir el link.
  const destino = ANALISIS ? (vista || "comparativa") : "buscar";
  try { history.replaceState(history.state, "", Pagina.armarUrl(location.pathname, CONSULTA, destino)); } catch (e) {}
  aplicar(destino);
  if (ANALISIS) guardarHist(q);
  else consultar(q);              // sin resultados: el buscador lo dice, con el termino escrito
}

/* Atras y Adelante pueden cambiar la consulta, no solo la pestaña. popstate y
   hashchange llegan juntos: se atiende una vez. */
let navegando = false;
function alNavegar() {
  if (navegando) return;
  navegando = true;
  setTimeout(async () => {
    navegando = false;
    const { q, vista } = Pagina.leerUrl(location.search, location.hash);
    if (q !== CONSULTA) {
      if (!q) limpiarConsulta();
      else { try { await asegurarIndice(); fijarConsulta(q); } catch (e) { /* queda el curado */ } }
    }
    aplicar(vista);
  }, 0);
}

/* --- Ruteo --- */
function pintar(id) {
  const v = $("#vista");
  if (CONSULTA && ANALISIS && DINAMICAS.includes(id)) v.innerHTML = vistaDinamica(id);
  else if (id === "comparativa") v.innerHTML = vistaComparativa();
  else if (id === "ofertas") v.innerHTML = vistaOfertas();
  else if (id === "tiendas") v.innerHTML = vistaTiendas();
  else if (id === "buscar") v.innerHTML = vistaBuscar();
  else if (id === "veredicto") v.innerHTML = vistaVeredicto();
  else if (porId[id]) { v.innerHTML = detalle(porId[id]); return; }
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.ir === id)));
}

/* El hash es la unica fuente de verdad: asi andan el boton Atras del
   navegador, los enlaces directos a una tarjeta y recargar la pagina. */
let subirAlPintar = false;

const ALIAS = { memorias: "comparativa", webcams: "comparativa" };  // enlaces viejos que siguen andando

function elegirCategoria(cat) {
  CAT = cat;
  try { localStorage.setItem("cat", cat); } catch (e) { /* sin storage, se pierde al recargar */ }
}

function aplicar(id) {
  if (id === "webcams") elegirCategoria("webcam");
  if (porId[id]) elegirCategoria(catDe(porId[id]));
  id = ALIAS[id] || id;
  pintar(VISTAS.some(v => v.id === id) || porId[id] ? id : "comparativa");
  if (subirAlPintar) $(".tabs").scrollIntoView({ behavior: "smooth", block: "start" });
  subirAlPintar = false;
}

function ir(id, scroll) {
  subirAlPintar = !!scroll;
  if (location.hash.slice(1) === id) aplicar(id);
  else location.hash = id;
}

window.addEventListener("hashchange", alNavegar);
window.addEventListener("popstate", alNavegar);

function arrancar() {
  if (!P.length) { $("#vista").innerHTML = '<p class="sub">No hay datos cargados todavía. Corré <code>python actualizar.py --build</code>.</p>'; return; }
  $("#tablist").innerHTML = VISTAS.map(v => {
    const n = v.n();
    return `<button class="tab" role="tab" data-ir="${v.id}" data-dina="${["comparativa", "tiendas", "veredicto"].includes(v.id) ? 1 : 0}" aria-selected="false">
      ${icono(v.ico)} ${v.eti}${n ? ` <span class="n">${n}</span>` : ""}</button>`;
  }).join("");
  $("#sello").textContent = `Precios verificados en cada sitio · actualizado ${DATOS.actualizado} · ${P.length} productos seguidos`;
  $("#nota").innerHTML = `Precios con IVA tomados de CompraGamer, Gaming City, Mexx y FullH4rd, con el precio de
    transferencia o depósito de cada una. Las specs salen de las webs de ADATA, Corsair y Kingston, no de las fichas
    de las tiendas. Para refrescar todo: <code>python actualizar.py</code>. El stock y los precios de hardware se
    mueven rápido: confirmá antes de pagar.`;

  document.addEventListener("click", ev => {
    const tab = ev.target.closest(".tab");
    if (tab) return ir(tab.dataset.ir, false);
    const abrir = ev.target.closest("[data-abrir]");
    if (abrir) return ir(abrir.dataset.abrir, true);
    const seg = ev.target.closest("[data-cat]");
    if (seg) { limpiarConsulta(); elegirCategoria(seg.dataset.cat); return ir("comparativa", false); }
    if (ev.target.closest("[data-volver]")) return ir("comparativa", true);

    // quitar del historial: se maneja antes que repetir, porque la x vive adentro
    const quitar = ev.target.closest("[data-olvidar]");
    if (quitar) { ev.stopPropagation(); return olvidar(quitar.dataset.olvidar); }

    const comparar = ev.target.closest("[data-comparar]");
    if (comparar) return compararConsulta(comparar.dataset.comparar);

    // ---- Ofertas ----
    const ofe = ev.target.closest("[data-of]");
    if (ofe) return ofertasAccion(ofe);
    const estrella = ev.target.closest("[data-estrella]");
    if (estrella) return marcarEstrella(estrella);
    const comparaOf = ev.target.closest("[data-comparar-oferta]");
    if (comparaOf) return compararOferta(+comparaOf.dataset.compararOferta);
    const tarjetaOf = ev.target.closest(".ocard");
    if (tarjetaOf && !ev.target.closest("a,button")) return tarjetaOf.classList.toggle("abierta");

    const repetir = ev.target.closest("[data-rep]");
    if (repetir) return consultar(repetir.dataset.rep);

    const orden = ev.target.closest("[data-orden]");
    if (orden) {
      ORDEN = orden.dataset.orden;
      try { localStorage.setItem("orden", ORDEN); } catch (e) {}
      document.querySelectorAll("[data-orden]").forEach(b =>
        b.setAttribute("aria-selected", String(b.dataset.orden === ORDEN)));
      return pintarResultados(($("#q") || {}).value || "");
    }

    const irCat = ev.target.closest("[data-ir-cat]");
    if (irCat) { limpiarConsulta(); elegirCategoria(irCat.dataset.irCat); return ir("comparativa", true); }

    const irVista = ev.target.closest("[data-ir-vista]");
    if (irVista) return ir(irVista.dataset.irVista, true);

    if (ev.target.closest("[data-cambiar-consulta]")) return ir("buscar", true);

    if (ev.target.closest("[data-quitar-consulta]")) {
      limpiarConsulta();
      return aplicar(location.hash.slice(1));
    }

    const sugerida = ev.target.closest(".sug");
    if (sugerida) return consultar(sugerida.textContent.trim());

    // desde una oferta, saltar al buscador con las palabras distintivas
    const similar = ev.target.closest("[data-similar]");
    if (similar) {
      // Para buscar similares sirven categoria y marca, no el codigo de modelo:
      // "Notebook HP Intel" trae competencia, "15-fd2350la" trae ese producto solo.
      const clave = similar.dataset.similar.split(/\s+/)
        .filter(w => w.length >= 2 && !/\d/.test(w)).slice(0, 3).join(" ");
      ir("buscar", true);
      return setTimeout(() => consultar(clave), 60);
    }

    const refrescar = ev.target.closest("[data-refrescar]");
    if (refrescar) {
      const previo = refrescar.innerHTML;
      refrescar.innerHTML = `${icono("refrescar")} actualizando…`;
      return asegurarIndice(true)
        .then(() => { pintarResultados(($("#q") || {}).value || ""); pintarOfertas(); })
        .catch(() => {})
        .finally(() => { refrescar.innerHTML = previo; });
    }
  });

  const marcarDesborde = () => {
    const l = $(".tablist");
    $(".tabs").dataset.desborda = l.scrollWidth > l.clientWidth + 2 ? "1" : "0";
  };
  marcarDesborde();
  addEventListener("resize", marcarDesborde);
  $("#pie-impresion").textContent =
    `La Pichincha · ${location.origin}${location.pathname} · precios de ${DATOS.actualizado}, con IVA, sin envío.`;

  const inicio = Pagina.leerUrl(location.search, location.hash);
  if (inicio.q) abrirConsultaDeUrl(inicio.q, inicio.vista);
  else aplicar(inicio.vista);
}
arrancar();
</script>
